project:
    id: af7be9aa-1fcf-492f-a8ff-84ffbf9c1756
session:
    idle_timeout_seconds: 1800
build:
    profiles:
        preview:
            web:
                app_id: 9aee13e8-7bb7-48a4-8133-972204a7a467
                setup_commands:
                    # public/data vive na branch órfão ventu-data (docs/DATA-BRANCH-MIGRATION.md)
                    # — o build estático precisa dela: overlay via tarball do branch.
                    - curl -sL https://github.com/braindeadpt/VenTu/archive/refs/heads/ventu-data.tar.gz | tar -xz --strip-components=1
                    - npm ci
                build_commands:
                    - npm run build
                output_path: out
                env:
                    NEXT_PUBLIC_SITE_URL: https://ventu.surf
                    NEXT_PUBLIC_BASE_PATH: ''
                    NEXT_PUBLIC_SUPABASE_URL: https://rejqnptjcdxfdajqbmvl.supabase.co
                    NEXT_PUBLIC_OBS_WORKER_URL: https://ventu-observations.busntech-net.workers.dev
                secrets:
                    - NEXT_PUBLIC_CARTO_API_KEY
                    - NEXT_PUBLIC_SUPABASE_ANON_KEY
pr_review:
    enabled: true
    build:
        kind: revyl
        profile: preview
    proof_of_changes:
        enabled: true
        harness:
            kind: revyl
