name = "ventu-observations"
main = "src/index.ts"
compatibility_date = "2026-06-01"

[vars]
ECOWITT_LAT = "41.15703"
ECOWITT_LON = "-8.681834"
ECOWITT_NAME = "Foz do Porto"
# Production: only the live site. Localhost belongs in [env.dev.vars].
ALLOWED_ORIGINS = "https://ventu.surf"

# Secrets (wrangler secret put — never commit):
# ECOWITT_APPLICATION_KEY, ECOWITT_API_KEY, ECOWITT_MAC

[env.dev]
name = "ventu-observations-dev"

[env.dev.vars]
ECOWITT_LAT = "41.15703"
ECOWITT_LON = "-8.681834"
ECOWITT_NAME = "Foz do Porto"
ALLOWED_ORIGINS = "https://ventu.surf,http://localhost:3000,http://localhost:3001"
