name: Preparar export para testes
description: >-
  Node + npm ci + export estático (artefacto do job de build) + Chromium do
  Playwright. Usado pelos jobs paralelos do ci.yml depois do checkout.
inputs:
  artefacto:
    description: Nome do artefacto com o export (out-live ou out-visual)
    required: true
  chromium:
    description: Instalar o Chromium do Playwright ('true'/'false')
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Download export
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artefacto }}

    - name: Unpack export into out/
      shell: bash
      run: |
        tar -I zstd -xf out.tar.zst
        rm out.tar.zst
        test -f out/index.html

    - name: Cache Playwright Chromium
      if: inputs.chromium == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

    - name: Install Playwright Chromium
      if: inputs.chromium == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
