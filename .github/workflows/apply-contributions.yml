name: Apply Community Tips

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Dois pushes do bot ao mesmo ficheiro de contribuições = race no rebase;
# a fila (sem cancelamento) serializa as execuções como nos outros workflows.
concurrency:
  group: apply-contributions
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Hydrate public/data (ventu-data)
        run: git fetch origin ventu-data --depth=1 && git checkout FETCH_HEAD -- public/data data-state || true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Merge approved tips
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run contributions:apply

      - name: Validate data files (UTF-8 + JSON + schema)
        run: node scripts/validate-data-files.js

      - name: Commit if changed
        run: |
          # Publica na branch órfão ventu-data (nunca na main) — plumbing
          # puro, branch de 1 commit, sem tocar na working tree.
          bash scripts/push-data-file.sh \
            "auto: apply community tips" \
            public/data/community-tips.json
