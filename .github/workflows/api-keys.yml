name: API Keys Health

on:
  schedule:
    # Semanal (segunda 06:00 UTC) — falha cedo quando uma key expira. Job
    # opcional: nunca bloqueia PRs nem o deploy; só agenda + manual.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-keys-health
  cancel-in-progress: false

jobs:
  check-api-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level env so `if: env.X != ''` actually sees the secrets.
    # Step-level `env:` is NOT visible to that same step's `if` condition.
    env:
      METEOALARM_API_KEY: ${{ secrets.METEOALARM_API_KEY }}
      IH_API_KEY: ${{ secrets.IH_API_KEY }}
      ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
      ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
      ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      OBS_WORKER_URL: ${{ vars.NEXT_PUBLIC_OBS_WORKER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # MeteoAlarm (EUMETNET) — token do fallback de avisos. Se estiver
      # configurado mas inválido/expirado, o teste falha (job vermelho).
      # Ausente → aviso em vez de falhar (a key é gratuita; guia em
      # docs/METEOALARM_API_KEY.md).
      - name: Test MeteoAlarm API token (EDR → CAP → payload)
        if: env.METEOALARM_API_KEY != ''
        run: node scripts/test-meteoalarm-api-key.js

      - name: Warn when METEOALARM_API_KEY missing
        if: env.METEOALARM_API_KEY == ''
        run: echo "::warning::METEOALARM_API_KEY não configurada — fallback MeteoAlarm dos avisos indisponível (ver docs/METEOALARM_API_KEY.md)"

      # IH Datawell — camada observedWave. Corremos o buoys:test-key COMBINADO
      # (node scripts/buoys-test-key.js): (1) diagnóstico real da key
      # (stations → getDatawellData → frescura) e, só se passar, (2) a
      # verificação hermética da cadeia Fugro→observedWave
      # (observedWaveNazareE2E) — a key expirada falha cedo (job vermelho), e
      # a Nazaré não passa silenciosamente sem leitura. Ausente → aviso (a
      # key está pendente; guia em docs/IH_API_KEY.md).
      - name: Test IH Datawell key + Nazaré chain (buoys:test-key)
        if: env.IH_API_KEY != ''
        run: node scripts/buoys-test-key.js

      - name: Warn when IH_API_KEY missing
        if: env.IH_API_KEY == ''
        run: echo "::warning::IH_API_KEY não configurada — observedWave desactivado (ver docs/IH_API_KEY.md)"

      # Ecowitt PWS — vento observado (merge-observations). As três
      # credenciais (application_key + api_key + MAC/IMEI) configuradas mas
      # inválidas → falha (job vermelho). Ausentes → aviso (a estação é
      # opcional; o vento cai para IPMA/METAR).
      - name: Test Ecowitt API credentials (device info → real_time)
        if: env.ECOWITT_API_KEY != ''
        run: node scripts/test-ecowitt-api-key.js

      - name: Warn when ECOWITT_* missing
        if: env.ECOWITT_API_KEY == ''
        run: echo "::warning::ECOWITT_* não configuradas — vento observado Ecowitt indisponível (estação PWS opcional)"

      # Resend — e-mail de alertas (evaluate-alerts). Key configurada mas
      # inválida/expirada → falha (job vermelho). Ausente → aviso (os alertas
      # por e-mail ficam em dry-run).
      - name: Test Resend API key (domains → send probe)
        if: env.RESEND_API_KEY != ''
        run: node scripts/test-resend-api-key.js

      - name: Warn when RESEND_API_KEY missing
        if: env.RESEND_API_KEY == ''
        run: echo "::warning::RESEND_API_KEY não configurada — alertas por e-mail em dry-run (ver scripts/alerts-preflight.js)"

      # Cloudflare Worker de observações ao vivo (IPMA/Ecowitt/METAR).
      # Sem secret — só a URL pública. /obs tem de responder; /health
      # pode 404 até o próximo deploy do worker (aviso, não falha).
      - name: Probe observations worker (GET /obs)
        env:
          NEXT_PUBLIC_OBS_WORKER_URL: ${{ env.OBS_WORKER_URL }}
        run: node scripts/check-obs-worker.js
