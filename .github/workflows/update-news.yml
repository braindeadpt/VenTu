name: Update VenTu News

on:
  schedule:
    # News + LLM auxiliary every 2 days at 06:00 UTC (saves API quota)
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ventu-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Update News
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS }}
        run: node scripts/update-news.js

      - name: Validate data files (UTF-8 + JSON + http(s) URLs)
        run: node scripts/validate-data-files.js

      # O sitemap é GERADO a partir de public/data/news.json (as URLs das notícias
      # entram no sitemap). Sem este passo, o ficheiro commitado ficaria stale a
      # cada actualização de notícias e o drift guard do ci.yml (check-sitemap-
      # drift.js) falharia no próximo push de código — o sitemap nunca deve ser
      # editado à mão, só regenerado.
      # Só regenerado QUANDO as notícias mudaram: o <lastmod> é a data de hoje,
      # logo regenerar sempre criaria um commit de ruído cada 2 dias (o guard
      # ignora lastmod, mas o repo não precisa do churn). O passo de commit
      # regera o sitemap DEPOIS de confirmar que há news diffs staged.
      - name: Commit and Push (news + sitemap regenerated)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/news.json
          if git diff --staged --quiet; then
            echo "No news changes to commit"
            exit 0
          fi
          # News changed → regenera o sitemap (as URLs de notícias entram nele)
          # e commita os dois juntos. Só aqui: sem news diffs, o sitemap
          # existente já está correcto (só lastmod envelhece, que é ignorado).
          node scripts/generate-sitemap.js
          git add -f public/sitemap.xml
          git commit -m "auto: update news feed + sitemap [$(date +'%Y-%m-%d %H:%M')]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $attempt); retrying..."
            sleep $((attempt * 4))
          done
          exit 1
