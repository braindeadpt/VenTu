name: Update VenTu News

on:
  schedule:
    # News + LLM auxiliary every 2 days at 06:00 UTC (saves API quota)
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update News
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS }}
        run: node scripts/update-news.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/news.json
          git diff --staged --quiet || (git commit -m "auto: update news feed [$(date +'%Y-%m-%d %H:%M')]" && git push)
