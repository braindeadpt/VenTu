name: Update VenTu News

on:
  schedule:
    # News + LLM auxiliary every 2 days at 06:00 UTC (saves API quota)
    - cron: '0 6 */2 * *'
  workflow_dispatch:

# `issues: write` — o pipeline abre/comenta a issue «Notícias: feed sem itens pt»
# (scripts/news/feed-health.js) quando o feed fica sem nenhum item pt. É a única
# permissão extra que este workflow precisa.
permissions:
  contents: write
  issues: write

concurrency:
  group: update-ventu-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    # LLM chain + feeds RSS; um fetch pendurado não pode segurar o grupo
    # de concorrência durante 6h (default GitHub).
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Update News
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-news.js

      - name: Validate data files (UTF-8 + JSON + http(s) URLs)
        run: node scripts/validate-data-files.js

      # O sitemap é GERADO a partir de public/data/news.json (as URLs das notícias
      # entram no sitemap). Sem este passo, o ficheiro commitado ficaria stale a
      # cada actualização de notícias e o drift guard do ci.yml (check-sitemap-
      # drift.js) falharia no próximo push de código — o sitemap nunca deve ser
      # editado à mão, só regenerado.
      # Só regenerado QUANDO as notícias mudaram: o <lastmod> é a data de hoje,
      # logo regenerar sempre criaria um commit de ruído cada 2 dias (o guard
      # ignora lastmod, mas o repo não precisa do churn). O passo de commit
      # regera o sitemap DEPOIS de confirmar que há news diffs staged.
      - name: Commit and Push (news + sitemap regenerated)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # news-sources.json é o estado de saúde por fonte (lastSeen de cada
          # fonte, ver scripts/news/source-health.js). É commitado mesmo quando
          # o feed não muda: é esse registo que sobrevive à TTL de 7 dias e
          # permite avisar antes de a fonte desaparecer do feed.
          git add -f public/data/news.json public/data/news-sources.json
          if git diff --staged --quiet; then
            echo "No news changes to commit"
            exit 0
          fi
          # Sitemap/RSS só quando o FEED mudou (as URLs das notícias entram no
          # sitemap). O estado por fonte muda em todas as corridas e não tem
          # nada que ver com o sitemap.
          if ! git diff --staged --quiet -- public/data/news.json; then
            node scripts/generate-sitemap.js
            node scripts/generate-rss.js
            git add -f public/sitemap.xml public/rss.xml public/rss-en.xml
          fi
          git commit -m "auto: update news feed + sitemap + rss [$(date +'%Y-%m-%d %H:%M')]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $attempt); retrying..."
            sleep $((attempt * 4))
          done
          exit 1
