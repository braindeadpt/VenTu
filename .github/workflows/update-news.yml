name: Update VenTu News

on:
  schedule:
    # News + LLM auxiliary every 2 days at 06:00 UTC (saves API quota)
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ventu-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Update News
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS }}
        run: node scripts/update-news.js

      - name: Validate data files (UTF-8 + JSON + http(s) URLs)
        run: node scripts/validate-data-files.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/news.json
          if git diff --staged --quiet; then
            echo "No news changes to commit"
            exit 0
          fi
          git commit -m "auto: update news feed [$(date +'%Y-%m-%d %H:%M')]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $attempt); retrying..."
            sleep $((attempt * 4))
          done
          exit 1
