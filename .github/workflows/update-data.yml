name: Update VenTu Data

on:
  schedule:
    # Marine/weather + spots index every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Avoid overlapping cron runs and push races on public/data/
concurrency:
  group: update-ventu-data
  cancel-in-progress: false

jobs:
  update-conditions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch IH Tide Station Data
        run: node scripts/fetch-ih-tides.js

      - name: Update Conditions
        run: |
          node scripts/update-conditions.js || {
            echo "First fetch failed — waiting 90s and retrying once..."
            sleep 90
            node scripts/update-conditions.js
          }

      - name: Merge IPMA + Ecowitt observations
        env:
          ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
        run: npm run obs:update

      - name: Build spots index
        run: npm run spots:index && npm run spots:lite

      - name: Commit and Push
        run: bash scripts/push-data-update.sh "auto: update conditions and spots index [$(date -u +'%Y-%m-%d %H:%M UTC')]"
