name: Update VenTu Data

on:
  schedule:
    # Marine/weather + spots index every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-conditions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch IH Tide Station Data
        run: node scripts/fetch-ih-tides.js

      - name: Update Conditions
        run: node scripts/update-conditions.js

      - name: Merge IPMA observations
        run: npm run obs:update

      - name: Build spots index
        run: npm run spots:index

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/
          git diff --staged --quiet || (git commit -m "auto: update conditions and spots index [$(date +'%Y-%m-%d %H:%M')]" && git push)
