name: Update VenTu Data

on:
  schedule:
    # Hourly UTC; Lisbon-aware gate picks full vs observations vs skip
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_mode:
        description: 'auto | full | observations (force Open-Meteo or obs-only)'
        required: false
        default: auto

permissions:
  contents: write
  actions: read # artifact download in the validate/commit jobs

concurrency:
  group: update-ventu-data
  cancel-in-progress: false

jobs:
  # ── 1. Pipeline: fetch + generate the data (no push) ──
  update-conditions:
    runs-on: ubuntu-latest
    # Job-level so `if: env.X != ''` sees the secrets (step-level env is
    # invisible to that step's own `if`).
    env:
      IH_API_KEY: ${{ secrets.IH_API_KEY }}
      METEOALARM_API_KEY: ${{ secrets.METEOALARM_API_KEY }}
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Schedule gate (Europe/Lisbon)
        id: gate
        env:
          VENTU_FORCE_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_mode != 'auto' && github.event.inputs.force_mode || '' }}
        run: node scripts/should-run-data-update.js

      - name: Setup Node.js
        if: steps.gate.outputs.mode != 'skip'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.mode != 'skip'
        run: npm ci

      - name: Print pipeline audit
        if: steps.gate.outputs.mode == 'full'
        run: node scripts/should-run-data-update.js --print-audit

      # Fallback EDR (radius por estação conhecida) já implementado no script —
      # ativar quando o backend de marés voltar adicionando a este passo:
      #   env: { IH_EDR_FALLBACK: '1' }
      # GATE: correr `npm run ih:validate` primeiro (probe real ao radius +
      # schema das features contra o stationFromFeature) — só ativar com exit 0
      # (ver docs/BACKLOG.md "Marés" — receita de recuperação)
      - name: Fetch IH Tide Station Data
        if: steps.gate.outputs.mode != 'skip'
        run: node scripts/fetch-ih-tides.js

      # Boias Datawell Waverider: estações via OGC API (sem key); séries de onda
      # (hm0/tp/thtp/hmax/temp) só com IH_API_KEY. Sem key o ficheiro fica só com
      # posições + last_sea e o merge-observations salta a camada observedWave.
      # Key rejeitada (HTTP 401/403): o script falha cedo (exit 1) com alerta
      # Telegram — o workflow pára neste passo em vez de publicar dados sem a
      # camada observedWave silenciosamente. TELEGRAM_BOT_TOKEN +
      # OPS_TELEGRAM_CHAT_ID só para o alerta; sem eles o script faz dry-run.
      - name: Fetch IH buoy data (Datawell Waverider)
        if: steps.gate.outputs.mode != 'skip'
        env:
          IH_API_KEY: ${{ secrets.IH_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPS_TELEGRAM_CHAT_ID: ${{ secrets.OPS_TELEGRAM_CHAT_ID }}
        run: node scripts/fetch-ih-buoys.js

      # Com a IH_API_KEY real configurada, o job falha aqui se o ficheiro
      # produzido não tiver a camada de onda: hasWaveData:true e a boia
      # Fugro 2 (Nazaré Costeira, idEst 2) com leitura fresh — a Costa de
      # Prata (36 spots mapeados) depende dela. Sem key o passo é saltado
      # (setup keyless continua a correr sem falhar). Key rejeitada (401) já
      # falha no passo acima por desenho.
      - name: Verify IH buoy layer (hasWaveData + Fugro 2 Nazaré)
        if: steps.gate.outputs.mode != 'skip' && env.IH_API_KEY != ''
        run: node scripts/verify-ih-buoy-layer.js

      # Isóbatas costeiras (depcnt_8_16_30): linhas de 8/16/30 m do IH (OGC API,
      # sem key) → spot-isobaths.json com a distância da praia a cada contorno
      # (bati­metria real perto da costa — card «Fundo perto da praia»).
      - name: Fetch IH coastal isobaths (8/16/30 m)
        if: steps.gate.outputs.mode != 'skip'
        run: node scripts/fetch-ih-isobaths.js

      # Boias WMO via Copernicus Marine S3 (sem key!) — fallback independente
      # para o observedWave do IH. Cataloga as Datawell PT (6201077/79) e as
      # espanholas do Puertos del Estado (6200024/25, 6200083–85), que voltaram
      # a reportar à Copernicus — cobertura cross-border real (Cabo Silleiro,
      # Villano, …). O merge-observations usa IH como primário e esta camada
      # como fallback (gate 6h vs 3h, ver copernicusBuoys.js).
      - name: Fetch WMO buoy data (Copernicus S3, keyless)
        if: steps.gate.outputs.mode != 'skip'
        run: node scripts/fetch-copernicus-buoys.js

      # Coerência cross-border: boias ES (Cabo Silleiro/Villano) vs PT
      # (Porto/Faro) nas horas sobrepostas → buoy-coherence.json. Valida que o
      # observedWave anexado a spots do NW PT por uma boia espanhola não está a
      # ler outra onda (ver scripts/check-buoy-coherence.js).
      - name: Check cross-border buoy coherence (ES × PT)
        if: steps.gate.outputs.mode != 'skip'
        run: node scripts/check-buoy-coherence.js

      # Skill/bias: Open-Meteo (ERA5) vs boias → wave-bias.json. IH Datawell
      # (com IH_API_KEY) + boias ES da Copernicus via WMO (sem key, Silleiro/
      # Villano/Bilbao/Peñas/Cádiz — leituras acumuladas em wmo-bias-archive.json).
      # A correcção é aplicada pelo passo seguinte apenas com
      # VENTU_WAVE_BIAS_CORRECTION=1 (guardas N≥30, |ME|≥0.15 m).
      - name: Fetch wave bias (Open-Meteo vs IH buoys)
        if: steps.gate.outputs.mode == 'full'
        env:
          IH_API_KEY: ${{ secrets.IH_API_KEY }}
        run: node scripts/fetch-wave-bias.js

      # Forecast skill REAL (best_match vs boia, arquivado run a run →
      # forecast-skill.json) — distinto do wave-bias (ERA5/reanálise). Cada run
      # arquiva previsões futuras + observações; os pares formam-se quando a
      # previsão feita antes da hora encontra a leitura real (lead time > 0).
      # Inclui as boias ES da Copernicus (sem key): ingere as leituras
      # acumuladas do wmo-bias-archive.json (passo acima) e arquiva o best_match
      # dos spots NW (Silleiro/Villano) e Algarve (Cádiz) — pares ES mesmo sem
      # IH_API_KEY. Corre a seguir ao fetch-wave-bias (precisa do arquivo WMO).
      - name: Fetch forecast skill (best_match vs IH buoys, archive)
        if: steps.gate.outputs.mode == 'full'
        env:
          IH_API_KEY: ${{ secrets.IH_API_KEY }}
        run: node scripts/fetch-forecast-skill.js

      # Health-check do forecast-skill: arquiva um snapshot diário por boia
      # (skill-regression-archive.json) e compara a janela recente (7 dias)
      # com a baseline (21 dias) — avisa quando o RMSE/|ME| de uma boia piora
      # acima do limiar (regressão do modelo). Report em
      # skill-regression.json; notificação Telegram só na transição.
      - name: Check forecast-skill regression (per-buoy health)
        if: steps.gate.outputs.mode == 'full'
        run: node scripts/check-skill-regression.js

      # Avisos meteorológicos IPMA (warnings_www.json, grátis, sem key) —
      # camada de segurança para surf/kite (Agitação Marítima, Vento, Trovoada).
      # Se o IPMA estiver em baixo, o próprio script cai para o MeteoAlarm
      # (EUMETNET, token grátis METEOALARM_API_KEY) e escreve source:
      # 'meteoalarm' no warnings.json.
      - name: Fetch IPMA weather warnings (MeteoAlarm fallback)
        if: steps.gate.outputs.mode != 'skip'
        run: node scripts/fetch-ipma-warnings.js

      # Com a METEOALARM_API_KEY real configurada, o job falha aqui se o
      # warnings.json ficou source:'meteoalarm' (IPMA em baixo → fallback)
      # mas SEM avisos activos — dupla falha que deixaria a camada de segurança
      # vazia por cima dos spots. Sem token o passo é saltado (mirror do
      # verify-ih-buoy-layer). Corre DEPOIS do fetch — nunca o substitui.
      - name: Verify MeteoAlarm warnings layer (fallback empty)
        if: steps.gate.outputs.mode != 'skip' && env.METEOALARM_API_KEY != ''
        run: node scripts/verify-meteoalarm-warnings.js

      # Avisos à Navegação Costeiros do IH (nav_warning_coastal, OGC API sem
      # key) — camada de segurança marítima complementar ao IPMA/MeteoAlarm:
      # exercícios, perigos, restrições com cobertura por polígono →
      # ih-coastal-warnings.json (per-spot coverage via point-in-polygon).
      # Cross-border NW: ES_NAV_WARNINGS_URL (variável de repositório) aponta
      # para um feed GeoJSON dos «Avisos a los navegantes» espanhóis quando
      # existir — entra na mesma camada com source:'es'. Sem URL, degrada.
      - name: Fetch IH coastal navigation warnings
        if: steps.gate.outputs.mode != 'skip'
        env:
          ES_NAV_WARNINGS_URL: ${{ vars.ES_NAV_WARNINGS_URL }}
        run: node scripts/fetch-ih-coastal-warnings.js

      # Radar IPMA — frame PNG mais recente (manifest imgs-radar.json, 5 min)
      # + bounds oficiais do overlay Leaflet do IPMA. Sem WMTS/tiles públicos;
      # bake do frame para o nosso origin (ver scripts/fetch-ipma-radar.js).
      - name: Fetch IPMA radar frame
        if: steps.gate.outputs.mode != 'skip'
        run: node scripts/fetch-ipma-radar.js

      - name: Update Conditions (Open-Meteo)
        if: steps.gate.outputs.mode == 'full'
        # Para activar o AIFS (vento) quando o Open-Meteo o servir no endpoint
        # gratuito, adicionar: VENTU_WIND_AIFS: '1' (hoje devolve null — gasta
        # quota sem dados, por isso fica off por omissão).
        env:
          VENTU_MULTIMODEL: ${{ steps.gate.outputs.multimodel }}
          VENTU_WAVE_BIAS_CORRECTION: ${{ vars.VENTU_WAVE_BIAS_CORRECTION }}
        run: |
          for attempt in 1 2 3; do
            echo "=== Open-Meteo fetch attempt ${attempt}/3 ==="
            if node scripts/update-conditions.js; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              wait=$((attempt * 90))
              echo "Fetch failed — waiting ${wait}s before retry..."
              sleep "$wait"
            fi
          done
          echo "::error::Open-Meteo update failed after 3 attempts"
          exit 1

      - name: Merge IPMA + Ecowitt observations
        if: steps.gate.outputs.mode != 'skip'
        env:
          ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
        run: npm run obs:update

      # Health-check UNIFICADO das camadas de dados: obs:update/update-conditions
      # gravam em pipeline-meta.json o streak de runs consecutivas com cada
      # camada em 'down'/'stale' (buoyLayer — boias IH/WMO; radarLayer — radar
      # IPMA; warningsLayer — avisos IPMA/MeteoAlarm; 'no-key' das boias nunca
      # conta). UM passo avisa a partir de 3 runs e falha o job a partir de 6
      # runs (~6 h) quando QUALQUER camada esteve degradada demasiado tempo sem
      # ninguém ver (limiares env-overridable: DATA_LAYER_WARN_AFTER/FAIL_AFTER).
      - name: Check data layers health (down/stale streak)
        if: steps.gate.outputs.mode != 'skip'
        run: node scripts/check-data-layer-health.js

      - name: Build spots index
        if: steps.gate.outputs.mode != 'skip'
        run: npm run spots:index && npm run spots:lite

      - name: Upload fresh data artifact
        if: steps.gate.outputs.mode != 'skip'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ventu-data
          path: public/data
          if-no-files-found: error
          retention-days: 1

  # ── 2. Validation gate (no build): UTF-8 + JSON + schema + TTL ──
  validate-data:
    if: needs.update-conditions.outputs.mode != 'skip'
    needs: update-conditions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Download fresh data artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ventu-data
          path: /tmp/ventu-data

      - name: Stage fresh data into public/data
        run: |
          rm -rf public/data
          mkdir -p public/data
          cp -a /tmp/ventu-data/. public/data/

      - name: Validate data files (UTF-8 + JSON)
        run: node scripts/validate-data-files.js

      - name: Validate generated data (schema + TTL)
        run: node scripts/validate-generated-data.js --mode=${{ needs.update-conditions.outputs.mode }}

      - name: Verify Open-Meteo freshness
        if: needs.update-conditions.outputs.mode == 'full'
        run: node scripts/verify-pipeline-freshness.js

  # ── 3. Commit and push — only after the validation gate passed ──
  commit-and-push:
    if: needs.update-conditions.outputs.mode != 'skip'
    needs: [update-conditions, validate-data]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Download fresh data artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ventu-data
          path: /tmp/ventu-data

      - name: Stage fresh data into public/data
        run: |
          rm -rf public/data
          mkdir -p public/data
          cp -a /tmp/ventu-data/. public/data/

      - name: Commit and Push
        run: |
          if [ "${{ needs.update-conditions.outputs.mode }}" = "observations" ]; then
            bash scripts/push-data-update.sh "auto: refresh observations [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          else
            bash scripts/push-data-update.sh "auto: update conditions and spots index [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          fi
