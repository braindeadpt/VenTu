name: Update VenTu Data

on:
  schedule:
    # Marine/weather + spots index every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Avoid overlapping cron runs and push races on public/data/
concurrency:
  group: update-ventu-data
  cancel-in-progress: false

jobs:
  update-conditions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch IH Tide Station Data
        run: node scripts/fetch-ih-tides.js

      - name: Update Conditions
        run: node scripts/update-conditions.js

      - name: Merge IPMA + Ecowitt observations
        env:
          ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
        run: npm run obs:update

      - name: Build spots index
        run: npm run spots:index && npm run spots:lite

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "auto: update conditions and spots index [$(date +'%Y-%m-%d %H:%M')]"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $attempt) — another workflow may have updated main; retrying..."
            sleep $((attempt * 4))
          done
          echo "Failed to push after 5 attempts"
          exit 1
