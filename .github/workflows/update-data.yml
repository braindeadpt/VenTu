name: Update VenTu Data

on:
  schedule:
    # Hourly UTC; Lisbon-aware gate picks full vs observations vs skip
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_mode:
        description: 'auto | full | observations (force Open-Meteo or obs-only)'
        required: false
        default: auto

permissions:
  contents: write

concurrency:
  group: update-ventu-data
  cancel-in-progress: false

jobs:
  update-conditions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Schedule gate (Europe/Lisbon)
        id: gate
        env:
          VENTU_FORCE_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_mode != 'auto' && github.event.inputs.force_mode || '' }}
        run: node scripts/should-run-data-update.js

      - name: Setup Node.js
        if: steps.gate.outputs.mode != 'skip'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.mode != 'skip'
        run: npm ci

      - name: Print pipeline audit
        if: steps.gate.outputs.mode == 'full'
        run: node scripts/should-run-data-update.js --print-audit

      - name: Fetch IH Tide Station Data
        if: steps.gate.outputs.mode != 'skip'
        run: node scripts/fetch-ih-tides.js

      - name: Update Conditions (Open-Meteo)
        if: steps.gate.outputs.mode == 'full'
        run: |
          node scripts/update-conditions.js || {
            echo "First fetch failed — waiting 90s and retrying once..."
            sleep 90
            node scripts/update-conditions.js
          }

      - name: Merge IPMA + Ecowitt observations
        if: steps.gate.outputs.mode != 'skip'
        env:
          ECOWITT_APPLICATION_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
        run: npm run obs:update

      - name: Build spots index
        if: steps.gate.outputs.mode != 'skip'
        run: npm run spots:index && npm run spots:lite

      - name: Commit and Push
        if: steps.gate.outputs.mode != 'skip'
        run: |
          if [ "${{ steps.gate.outputs.mode }}" = "observations" ]; then
            bash scripts/push-data-update.sh "auto: refresh observations [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          else
            bash scripts/push-data-update.sh "auto: update conditions and spots index [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          fi
