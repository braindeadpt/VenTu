name: Record Visual Baselines

# Re-records the toHaveScreenshot golden baselines on Linux (the platform CI
# gates on) and commits them back to main. Baselines are platform-bound
# (font anti-aliasing differs per OS), so a Windows contributor cannot
# produce them — this workflow is the ONLY way they get refreshed.
#
# Triggers:
#  - after every successful CI run on main (workflow_run): data commits
#    (~15×/day, visible score/label text) legitimately change pixels, so
#    baselines must chase the data or the gate would go permanently red;
#  - manual (workflow_dispatch) after a deliberate visual change.
#
# The record step runs the suite in --update-snapshots mode on Linux and
# commits whatever changed. Pushing a bot commit does NOT re-trigger CI for
# it (paths-ignore public/data/** does not cover tests/, so it does trigger —
# but CI on the baseline commit validates the new baselines, which is exactly
# what we want: red gate on a bad record run is caught by the next CI run).
#
# KNOWN CAVEAT: data-only commits don't run CI (paths-ignore), so if baked
# SSG text (e.g. the news list) changes between code commits, the next code
# commit's pixel gate can fail on data drift. Fix: run this workflow manually
# (workflow_dispatch) — one click re-records and CI greens on the baseline
# commit. Deliberate trade: automatic recording on every data refresh would
# burn a build+record+CI cycle ~15×/day for marginal benefit.

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: record-visual-baselines
  cancel-in-progress: false

jobs:
  record:
    # Only record after a SUCCESSFUL CI run — never paper over a red gate.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_OBS_WORKER_URL: ${{ vars.NEXT_PUBLIC_OBS_WORKER_URL || 'https://ventu-observations.busntech-net.workers.dev' }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_API_KEY }}
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Records even when the suite would FAIL: --update-snapshots rewrites
      # baselines first, so the run always exits 0 here.
      - name: Re-record baselines (Linux)
        run: npm run test:visual:update
        env:
          CI: true

      - name: Commit refreshed baselines
        id: commit
        run: |
          # git diff --quiet would MISS newly-recorded baselines: the first
          # recording produces UNTRACKED files, and git diff only reports
          # tracked changes. git status --porcelain sees both.
          if [ -z "$(git status --porcelain -- tests/e2e/visual-regression.spec.ts-snapshots)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Baselines unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual-regression.spec.ts-snapshots
          git commit -m "chore(visual): refresh Linux baselines from CI data refresh"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "Baselines refreshed and pushed — next CI run gates on them." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No pixel drift; baselines already current." >> "$GITHUB_STEP_SUMMARY"
          fi
