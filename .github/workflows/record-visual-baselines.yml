name: Record Visual Baselines

# Re-records the toHaveScreenshot golden baselines on Linux (the platform CI
# gates on) and commits them back to main. Baselines are platform-bound
# (font anti-aliasing differs per OS), so a Windows contributor cannot
# produce them — this workflow is the ONLY way they get refreshed.
#
# MANUAL ONLY (workflow_dispatch). The old workflow_run auto-trigger (record
# after every successful CI run) was removed: CI never runs on data commits
# (public/data/** is paths-ignored), so it never chased data shape changes,
# and on code commits it burned a build+record+CI cycle per commit while
# re-syncing the fixture by VALUE (the f8481d8f8 record committed 194 fixture
# JSONs / 36k lines of pure value churn). The fixture sync is now shape-gated
# (scripts/sync-visual-fixture.mjs rewrites a file only when its JSON
# structure changed), so a manual record after a value-only data refresh
# commits baselines WITHOUT touching the fixture.
#
# When to run:
#  - a deliberate visual change (masks, components, layout);
#  - the fixture SHAPE changed — a new spot, a new data file, a schema change.
#    (This workflow re-syncs the fixture from the fresh build before recording,
#    so baselines are always recorded on the current shape.)
# One click re-records and CI greens on the baseline commit; a bad record run
# is caught by the next CI run (the bot push triggers CI because tests/ is not
# paths-ignored).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to record baselines on (default: main). Use a dependabot Playwright PR branch to re-record for a new Chromium.'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write

concurrency:
  group: record-visual-baselines
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_OBS_WORKER_URL: ${{ vars.NEXT_PUBLIC_OBS_WORKER_URL || 'https://ventu-observations.busntech-net.workers.dev' }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_API_KEY }}
        run: npm run build

      - name: Re-sync visual fixture from build
        # gotoStable serves /data/** from the COMMITTED fixture, never the
        # build. Before recording, refresh that fixture from THIS build so a
        # data-shape change (new spot / new file / schema) can't record
        # baselines against a stale shape — fixture and baselines stay in
        # lockstep. Shape-gated: value-only data churn is SKIPPED, so a
        # routine record commits baselines without fixture churn.
        run: node scripts/sync-visual-fixture.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Records even when the suite would FAIL: --update-snapshots rewrites
      # baselines first, so the run always exits 0 here.
      - name: Re-record baselines (Linux)
        run: npm run test:visual:update
        env:
          CI: true

      - name: Commit refreshed baselines
        id: commit
        run: |
          # git diff --quiet would MISS newly-recorded baselines: the first
          # recording produces UNTRACKED files, and git diff only reports
          # tracked changes. git status --porcelain sees both.
          # The fixture may also have changed (re-synced from the build above);
          # commit it WITH the baselines so CI gates on the exact shape recorded.
          if [ -z "$(git status --porcelain -- tests/e2e/visual-regression.spec.ts-snapshots tests/e2e/fixtures/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Baselines and fixture unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual-regression.spec.ts-snapshots tests/e2e/fixtures/data
          git commit -m "chore(visual): refresh Linux baselines (fixture only on shape change)"
          git push origin "HEAD:${{ inputs.ref }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "Baselines refreshed and pushed — next CI run gates on them." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No pixel drift; baselines already current." >> "$GITHUB_STEP_SUMMARY"
          fi
