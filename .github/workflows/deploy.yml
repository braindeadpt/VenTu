name: Deploy to GitHub Pages

# Publicação em duas fontes (opção B — separar código de dados).
#
# Contexto: os workflows de dados correm a cada ~30 min e NÃO disparam o CI
# (public/data/** está em paths-ignore, de propósito, para os bots não
# queimarem execuções). Por isso o gate antigo («CI vermelho ⇒ sem deploy»)
# só valia para o caminho push → CI, que passou a ser a minoria dos gatilhos:
# um commit de dados publicava o main inteiro, código vermelho incluído (prova
# em 22/09: babd0e133 e 0cebb705d deram deploy skipped; às 05:29 um commit de
# dados deu deploy success levando os dois).
#
# Com a opção B publicamos:
#   - CÓDIGO do último commit cujo run do CI em main terminou com sucesso;
#   - DADOS (public/data/**) do main actual, sobrepostos ANTES do build.
# Os utilizadores nunca perdem condições novas (foi o que motivou a escolha:
# o CI esteve vermelho em 16 de 27 execuções numa semana); código vermelho
# nunca chega à produção. O custo passa a ser invisível — daí o job summary
# com o atraso e o aviso acima do limiar (o ops-audit diário reutiliza a issue
# `ops-audit` quando o atraso fica prolongado).
#
# Os paths-ignore dos workflows de dados não se tocam. O caminho
# workflow_dispatch continua a ser decisão humana explícita, sem portão.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve e descreve o que faria, mas não publica'
        type: boolean
        default: false
  workflow_run:
    workflows:
      - CI
      - Update VenTu Data
      - Dawn Patrol AI Advisor
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Gate de entrada: workflow_dispatch é decisão humana; qualquer workflow_run
    # concluído com success (CI verde, dados ou Dawn Patrol) entra e é RESOLVIDO
    # pelo passo seguinte — só a resolução decide o que se publica. Runs de
    # pull_request nunca publicam.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    # Build + export de ~2340 rotas: ~15–20 min normal; 45 min é o mesmo
    # backstop do ci.yml quality (default GitHub = 6h). Inclui o smoke
    # critical-routes sobre o build.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Em workflow_run, main (o head_sha do evento é o commit ANTES do push
          # dos bots). Histórico completo: o SHA verde é um antepassado de main
          # e precisa de existir localmente para o checkout.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          fetch-depth: 0

      # Resolve código verde + dados frescos (opção B). Decide, valida a
      # ancestralidade e escreve o job summary com o atraso. Sem run verde na
      # janela ⇒ falha com barulho, nunca publica às escuras. Em dry_run,
      # descreve e não publica.
      - name: Resolve deploy source (código verde + dados frescos)
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VENTU_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/resolve-deploy-source.js

      # public/data entra ANTES do build: o site é um export estático e o SSG
      # lê os dados em build time (scores cozidos no HTML servido, imagens OG,
      # SEO). Copiar dados para cima de um site já construído deixaria só a
      # hidratação no cliente a corrigir. Nunca `checkout -f -B main` — a 22/09
      # isso moveu o ref main partilhado por todas as worktrees.
      - name: Checkout green code + overlay fresh data
        if: steps.source.outputs.needs_checkout == 'true'
        env:
          CODE_SHA: ${{ steps.source.outputs.code_sha }}
          DATA_SHA: ${{ steps.source.outputs.data_sha }}
        run: |
          git checkout --detach "$CODE_SHA"
          # rm antes do checkout: `git checkout <sha> -- public/data` restaura
          # ficheiros mas NÃO apaga os que só existem no verde — sem isto, um
          # ficheiro removido pela pipeline sobrevivia no artefacto.
          rm -rf public/data
          git checkout "$DATA_SHA" -- public/data
          echo "código (CI verde): $(git rev-parse --short HEAD)"
          echo "dados de main:     $DATA_SHA"

      # Validadores de dados que já existem (inclui a plausibilidade numérica
      # nova, scripts/lib/dataPlausibility.js ligado ao passo 5). Corre sobre a
      # combinação que só existe aqui — dados novos + código mais antigo — e é
      # dependency-free, por isso vem antes do npm ci.
      - name: Validate public/data
        run: node scripts/validate-data-files.js

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm cache clean --force
          npm ci

      - name: Unit tests
        run: npm test

      - name: Generate sitemap
        run: npm run sitemap:generate

      - name: Generate Dawn Patrol
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS }}
        run: node scripts/dawn-patrol.js

      - name: Cache Next.js build cache (.next/cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          # Key = só o lock hash (não github.sha): data-commits e pushes de código
          # partilham a MESMA entrada — exact hit sempre que o lock não muda.
          # Em mudança de dependências, o prefixo restaura o cache anterior.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOATCOUNTER_CODE: ${{ secrets.NEXT_PUBLIC_GOATCOUNTER_CODE }}
          NEXT_PUBLIC_OBS_WORKER_URL: ${{ vars.NEXT_PUBLIC_OBS_WORKER_URL || 'https://ventu-observations.busntech-net.workers.dev' }}
          # Public bot username (no @) — enables «Ligar Telegram» on /conta
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME || secrets.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_API_KEY }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            echo "::error::BUILD FAILED - Last 200 lines:"
            tail -200 build.log
            exit 1
          }

      - name: Validate _headers security directives
        run: node scripts/check-headers-file.js

      # Smoke sobre a combinação que passa a existir e que o CI nunca testa:
      # dados frescos + código mais antigo. Costuma ser segura (código antigo
      # ignora campos novos) e parte quando a pipeline renomeia/remove uma
      # chave que o código antigo lê — exactamente o que este smoke apanha.
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E — critical routes (smoke do deploy)
        run: npx playwright test critical-routes
        env:
          CI: 'true'

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: build.log
          retention-days: 1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          static_site_generator: next

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # dry_run (workflow_dispatch) corre todo o build e a resolução mas não
    # publica — é com ele que se valida a primeira vez sem tocar em produção.
    # Em workflow_run, inputs.dry_run é null ⇒ a condição é verdadeira.
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    # 5 tentativas × (deploy + 45s de espera) ≈ pior caso ~15 min.
    timeout-minutes: 20
    steps:
      # GitHub Pages API often fails transiently ("try again later") while build is fine.
      - name: Deploy to GitHub Pages (1/5)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (2/5)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (3/5)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before retry
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment2.outcome == 'failure' &&
          steps.deployment3.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (4/5)
        id: deployment4
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment2.outcome == 'failure' &&
          steps.deployment3.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before retry
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment2.outcome == 'failure' &&
          steps.deployment3.outcome == 'failure' &&
          steps.deployment4.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (5/5)
        id: deployment5
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment2.outcome == 'failure' &&
          steps.deployment3.outcome == 'failure' &&
          steps.deployment4.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Publish deployment URL
        id: publish
        if: always()
        env:
          URL1: ${{ steps.deployment.outputs.page_url }}
          URL2: ${{ steps.deployment2.outputs.page_url }}
          URL3: ${{ steps.deployment3.outputs.page_url }}
          URL4: ${{ steps.deployment4.outputs.page_url }}
          URL5: ${{ steps.deployment5.outputs.page_url }}
        run: |
          for url in "$URL5" "$URL4" "$URL3" "$URL2" "$URL1"; do
            if [ -n "$url" ]; then
              echo "page_url=$url" >> "$GITHUB_OUTPUT"
              echo "Deployed to $url"
              exit 0
            fi
          done
          echo "::error::GitHub Pages deploy failed after 5 attempts (transient API error). Re-run this workflow from Actions."
          exit 1

  security-headers:
    # Guard S7 (docs/SECURITY-HEADERS.md §4.1) — corre o verificador após o deploy
    # e falha o run se algum header estiver ausente. O checker falha de propósito
    # contra o GitHub Pages puro (estado pré-S7), por isso o job é saltado enquanto
    # a repo variable S7_PROXY_ENABLED não for 'true' (Settings → Secrets and
    # variables → Actions → Variables) — ativar só depois do proxy estar aplicado.
    # Em dry_run o deploy é saltado, logo este job também.
    if: vars.S7_PROXY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: deploy
    # 6 tentativas × 20s de espera ≈ pior caso ~10 min.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 1

      - name: Check S7 security headers in production (retries para o edge)
        env:
          BASE_URL: ${{ vars.S7_HEADERS_BASE_URL || 'https://ventu.surf' }}
        run: |
          attempts=6
          delay=20
          for i in $(seq 1 "$attempts"); do
            echo "==> Tentativa $i/$attempts — $BASE_URL"
            if bash scripts/check-security-headers.sh "$BASE_URL"; then
              echo "OK — headers S7 conforme em produção ($BASE_URL)"
              exit 0
            fi
            [ "$i" -lt "$attempts" ] || break
            echo "Headers ainda não presentes; a aguardar ${delay}s antes de revalidar..."
            sleep "$delay"
          done
          echo "::error::Headers S7 ausentes após $attempts tentativas em $BASE_URL — proxy Cloudflare/Transform Rules não aplicados ou regrediram (docs/SECURITY-HEADERS.md §4.1)."
          exit 1
