name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Bot data commits use GITHUB_TOKEN — they do not trigger `push` workflows.
  workflow_run:
    workflows:
      - Update VenTu Data
      - Dawn Patrol AI Advisor
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Data/Dawn jobs push new commits with GITHUB_TOKEN (no push trigger).
          # workflow_run.head_sha is the commit *before* that push — always use main.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm cache clean --force
          npm ci

      - name: Unit tests
        run: npm test

      - name: Generate sitemap
        run: npm run sitemap:generate

      - name: Generate Dawn Patrol
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS }}
        run: node scripts/dawn-patrol.js

      - name: Cache Next.js build cache (.next/cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          # Key = só o lock hash (não github.sha): data-commits e pushes de código
          # partilham a MESMA entrada — exact hit sempre que o lock não muda.
          # Em mudança de dependências, o prefixo restaura o cache anterior.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOATCOUNTER_CODE: ${{ secrets.NEXT_PUBLIC_GOATCOUNTER_CODE }}
          NEXT_PUBLIC_OBS_WORKER_URL: ${{ vars.NEXT_PUBLIC_OBS_WORKER_URL || 'https://ventu-observations.busntech-net.workers.dev' }}
          # Public bot username (no @) — enables «Ligar Telegram» on /conta
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME || secrets.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            echo "::error::BUILD FAILED - Last 200 lines:"
            tail -200 build.log
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log
          path: build.log
          retention-days: 1

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          static_site_generator: next

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # GitHub Pages API often fails transiently ("try again later") while build is fine.
      - name: Deploy to GitHub Pages (1/5)
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (2/5)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (3/5)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true

      - name: Wait before retry
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment2.outcome == 'failure' &&
          steps.deployment3.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (4/5)
        id: deployment4
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment2.outcome == 'failure' &&
          steps.deployment3.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true

      - name: Wait before retry
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment2.outcome == 'failure' &&
          steps.deployment3.outcome == 'failure' &&
          steps.deployment4.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (5/5)
        id: deployment5
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment2.outcome == 'failure' &&
          steps.deployment3.outcome == 'failure' &&
          steps.deployment4.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true

      - name: Publish deployment URL
        id: publish
        if: always()
        env:
          URL1: ${{ steps.deployment.outputs.page_url }}
          URL2: ${{ steps.deployment2.outputs.page_url }}
          URL3: ${{ steps.deployment3.outputs.page_url }}
          URL4: ${{ steps.deployment4.outputs.page_url }}
          URL5: ${{ steps.deployment5.outputs.page_url }}
        run: |
          for url in "$URL5" "$URL4" "$URL3" "$URL2" "$URL1"; do
            if [ -n "$url" ]; then
              echo "page_url=$url" >> "$GITHUB_OUTPUT"
              echo "Deployed to $url"
              exit 0
            fi
          done
          echo "::error::GitHub Pages deploy failed after 5 attempts (transient API error). Re-run this workflow from Actions."
          exit 1

  security-headers:
    # Guard S7 (docs/SECURITY-HEADERS.md §4.1) — corre o verificador após o deploy
    # e falha o run se algum header estiver ausente. O checker falha de propósito
    # contra o GitHub Pages puro (estado pré-S7), por isso o job é saltado enquanto
    # a repo variable S7_PROXY_ENABLED não for 'true' (Settings → Secrets and
    # variables → Actions → Variables) — ativar só depois do proxy estar aplicado.
    if: vars.S7_PROXY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # workflow_run.head_sha é o commit *antes* do push de dados — usa main
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          fetch-depth: 1

      - name: Check S7 security headers in production (retries para o edge)
        env:
          BASE_URL: ${{ vars.S7_HEADERS_BASE_URL || 'https://ventu.surf' }}
        run: |
          attempts=6
          delay=20
          for i in $(seq 1 "$attempts"); do
            echo "==> Tentativa $i/$attempts — $BASE_URL"
            if bash scripts/check-security-headers.sh "$BASE_URL"; then
              echo "OK — headers S7 conforme em produção ($BASE_URL)"
              exit 0
            fi
            [ "$i" -lt "$attempts" ] || break
            echo "Headers ainda não presentes; a aguardar ${delay}s antes de revalidar..."
            sleep "$delay"
          done
          echo "::error::Headers S7 ausentes após $attempts tentativas em $BASE_URL — proxy Cloudflare/Transform Rules não aplicados ou regrediram (docs/SECURITY-HEADERS.md §4.1)."
          exit 1
