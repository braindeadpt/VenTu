name: Deploy to GitHub Pages

# Etiqueta honesta do run. O SHA que o Actions mostra no run vem de GITHUB_SHA
# e, num workflow_run, é a ponta da main no momento do gatilho — não o run que
# disparou. Um deploy skipped (CI cancelado, por exemplo) ficava então com o
# SHA do merge seguinte e parecia ter publicado aquele código. O run-name põe
# o gatilho no título, skipped incluído — nesses runs o job `build` não corre e
# portanto não existe job summary (é scripts/resolve-deploy-source.js que o
# escreve, e só quando o job arranca).
run-name: "${{ github.event_name == 'workflow_run' && format('Deploy · {0} #{1} ({2}) · head {3}', github.event.workflow_run.name, github.event.workflow_run.run_number, github.event.workflow_run.conclusion, github.event.workflow_run.head_sha) || 'Deploy · manual' }}"

# Publicação em duas fontes (opção B — separar código de dados).
#
# Contexto: os workflows de dados correm a cada ~30 min e NÃO disparam o CI
# (public/data/** está em paths-ignore, de propósito, para os bots não
# queimarem execuções). Por isso o gate antigo («CI vermelho ⇒ sem deploy»)
# só valia para o caminho push → CI, que passou a ser a minoria dos gatilhos:
# um commit de dados publicava o main inteiro, código vermelho incluído (prova
# em 22/09: babd0e133 e 0cebb705d deram deploy skipped; às 05:29 um commit de
# dados deu deploy success levando os dois).
#
# Com a opção B publicamos:
#   - CÓDIGO do último commit cujo run do CI em main terminou com sucesso;
#   - DADOS (public/data/**) do main actual, sobrepostos ANTES do build.
# Os utilizadores nunca perdem condições novas (foi o que motivou a escolha:
# o CI esteve vermelho em 16 de 27 execuções numa semana); código vermelho
# nunca chega à produção. O custo passa a ser invisível — daí o job summary
# com o atraso e o aviso acima do limiar (o ops-audit diário reutiliza a issue
# `ops-audit` quando o atraso fica prolongado).
#
# Os paths-ignore dos workflows de dados não se tocam. O caminho
# workflow_dispatch continua a ser decisão humana explícita, sem portão.
#
# Deploy sem mudanças: cada run concluído do update-data (incluindo os que o
# gate deu skip) disparava um build completo. O resolve calcula a impressão
# digital (código verde + public/data + este workflow) e, se é a mesma que
# https://ventu.surf/deploy-source.json publica (com < 6 h), salta o build e o
# deploy. workflow_dispatch nunca salta.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Resolve e descreve o que faria, mas não publica'
        type: boolean
        default: false
  workflow_run:
    workflows:
      - CI
      - Update VenTu Data
    # «Dawn Patrol AI Advisor» sai da lista (#455): acordava em TODOS os
    # updates (mesmo gate=skip) e cada conclusão disparava um segundo deploy —
    # dois clones de ~1.8 GiB por ciclo só para o resolver dar skip. Agora o
    # dawn-patrol.yml faz `gh workflow run deploy.yml` quando empurra
    # realmente dawn-patrol.json para a ventu-data.
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  # read: o job precheck lê os runs do CI via gh api. write: o job deploy
  # apaga o artifact github-pages da própria run no fim (ver o step final).
  actions: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Filtro barato (#455): em workflow_run compara, via API e sem o clone de
  # ~1.8 GiB, a impressão digital do que se publicaria com a do live —
  # proceed=false só quando é provavelmente idêntica. Qualquer dúvida emite
  # proceed=true e o job build corre o resolve-deploy-source completo.
  precheck:
    # Gate de entrada: workflow_dispatch é decisão humana; workflow_run só
    # com success e fora de pull_request — a mesma porta que o build tinha.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      proceed: ${{ steps.precheck.outputs.proceed }}
    steps:
      - name: Sparse checkout (só scripts/)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: scripts/

      - name: Deploy precheck — fingerprint vs live
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-precheck.js

  build:
    needs: precheck
    # always() + result=failure: se o precheck falhar de infra (checkout/API),
    # o build corre na mesma — o precheck nunca pode recusar um deploy.
    if: >-
      always() &&
      (needs.precheck.result == 'failure' ||
       needs.precheck.outputs.proceed == 'true')
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.source.outputs.skip }}
    # Build + export de ~2340 rotas: ~15–20 min normal; 45 min é o mesmo
    # backstop do ci.yml quality (default GitHub = 6h). Inclui o smoke
    # critical-routes sobre o build.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Em workflow_run, main (o head_sha do evento é o commit ANTES do push
          # dos bots). Histórico completo: o SHA verde é um antepassado de main
          # e precisa de existir localmente para o checkout.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          fetch-depth: 0

      # Resolve código verde + dados frescos (opção B). Decide, valida a
      # ancestralidade e escreve o job summary com o atraso. Sem run verde na
      # janela ⇒ falha com barulho, nunca publica às escuras. Em dry_run,
      # descreve e não publica.
      - name: Resolve deploy source (código verde + dados frescos)
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VENTU_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/resolve-deploy-source.js

      # public/data entra ANTES do build: o site é um export estático e o SSG
      # lê os dados em build time (scores cozidos no HTML servido, imagens OG,
      # SEO). Copiar dados para cima de um site já construído deixaria só a
      # hidratação no cliente a corrigir. Nunca `checkout -f -B main` — a 22/09
      # isso moveu o ref main partilhado por todas as worktrees.
      - name: Checkout green code + overlay fresh data
        if: steps.source.outputs.needs_checkout == 'true' && steps.source.outputs.skip != 'true'
        env:
          CODE_SHA: ${{ steps.source.outputs.code_sha }}
          DATA_SHA: ${{ steps.source.outputs.data_sha }}
        run: |
          git checkout --detach "$CODE_SHA"
          # rm antes do checkout: `git checkout <sha> -- public/data` restaura
          # ficheiros mas NÃO apaga os que só existem no verde — sem isto, um
          # ficheiro removido pela pipeline sobrevivia no artefacto.
          rm -rf public/data
          # Dados + sitemap/rss vivem na branch órfão ventu-data (DATA_SHA).
          git checkout "$DATA_SHA" -- public/data public/sitemap.xml public/rss.xml public/rss-en.xml 2>/dev/null || git checkout "$DATA_SHA" -- public/data
          echo "código (CI verde): $(git rev-parse --short HEAD)"
          echo "dados (ventu-data): $DATA_SHA"

      # Validadores de dados que já existem (inclui a plausibilidade numérica
      # nova, scripts/lib/dataPlausibility.js ligado ao passo 5). Corre sobre a
      # combinação que só existe aqui — dados novos + código mais antigo — e é
      # dependency-free, por isso vem antes do npm ci.
      - name: Validate public/data
        if: steps.source.outputs.skip != 'true'
        run: node scripts/validate-data-files.js

      - name: Setup Node.js
        if: steps.source.outputs.skip != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        if: steps.source.outputs.skip != 'true'
        run: |
          npm cache clean --force
          npm ci

      - name: Unit tests
        if: steps.source.outputs.skip != 'true'
        run: npm test

      - name: Generate sitemap
        if: steps.source.outputs.skip != 'true'
        run: npm run sitemap:generate

      # Sem «Generate Dawn Patrol» aqui: o dawn-patrol.json é gerado e
      # commitado pelo workflow próprio (dawn-patrol.yml, janela do amanhecer
      # e gate should-run-dawn-patrol.js) e chega pelo overlay de public/data.
      # Gerá-lo em cada deploy chamava os LLM ~50×/dia, publicava um texto que
      # não estava na main (o próximo deploy podia trocá-lo) e, sobre código
      # verde mais antigo, corria um dawn-patrol.js diferente do da main.

      - name: Cache Next.js build cache (.next/cache)
        if: steps.source.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          # Key = só o lock hash (não github.sha): data-commits e pushes de código
          # partilham a MESMA entrada — exact hit sempre que o lock não muda.
          # Em mudança de dependências, o prefixo restaura o cache anterior.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        if: steps.source.outputs.skip != 'true'
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SITE_URL: 'https://ventu.surf'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GOATCOUNTER_CODE: ${{ secrets.NEXT_PUBLIC_GOATCOUNTER_CODE }}
          NEXT_PUBLIC_OBS_WORKER_URL: ${{ vars.NEXT_PUBLIC_OBS_WORKER_URL || 'https://ventu-observations.busntech-net.workers.dev' }}
          # Public bot username (no @) — enables «Ligar Telegram» on /conta
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ vars.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME || secrets.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_API_KEY }}
        run: |
          set -o pipefail
          # next/font/google faz fetch das fontes em build-time — uma falha de
          # rede transitória no runner matava o build inteiro (flakes de
          # 2026-10-11 e 2026-10-12). Uma retry cobre o caso sem mascarar
          # erros reais: a segunda falha continua a falhar o job.
          for attempt in 1 2; do
            if npm run build 2>&1 | tee build.log; then
              break
            fi
            if [ "$attempt" = "2" ]; then
              echo "::error::BUILD FAILED (attempt ${attempt}/2) - Last 200 lines:"
              tail -200 build.log
              exit 1
            fi
            echo "::warning::Build attempt ${attempt} failed — retrying once (transient font/registry fetch?)"
            rm -rf .next
            sleep 10
          done

      - name: Validate _headers security directives
        if: steps.source.outputs.skip != 'true'
        run: node scripts/check-headers-file.js

      # Impressão digital do que vai ser publicado (código verde + public/data
      # + deploy.yml): o próximo deploy compara-a com a do live e salta se é a
      # mesma (scripts/lib/deploySource.js — decideDeploySkip).
      - name: Write deploy-source.json
        if: steps.source.outputs.skip != 'true'
        env:
          DEPLOY_FINGERPRINT: ${{ steps.source.outputs.fingerprint }}
          CODE_SHA: ${{ steps.source.outputs.code_sha }}
          DATA_SHA: ${{ steps.source.outputs.data_sha }}
          STALE_DATA_ONLY_DAYS: ${{ steps.source.outputs.stale_data_only_days }}
        run: node scripts/resolve-deploy-source.js --write-manifest out/deploy-source.json

      # Smoke sobre a combinação que passa a existir e que o CI nunca testa:
      # dados frescos + código mais antigo. Costuma ser segura (código antigo
      # ignora campos novos) e parte quando a pipeline renomeia/remove uma
      # chave que o código antigo lê — exactamente o que este smoke apanha.
      - name: Cache Playwright Chromium
        if: steps.source.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.source.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E — critical routes (smoke do deploy)
        if: steps.source.outputs.skip != 'true'
        run: npx playwright test critical-routes
        env:
          CI: 'true'

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log
          path: build.log
          retention-days: 1

      - name: Setup Pages
        if: steps.source.outputs.skip != 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          static_site_generator: next

      - name: Upload artifact
        if: steps.source.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out
          # v4+ exclui dotfiles por defeito — sem isto o /.well-known/assetlinks.json
          # (Digital Asset Links da TWA) nunca chega ao Pages e a app Android abre
          # com barra de URL. .git/.github continuam excluídos pela action.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # dry_run (workflow_dispatch) corre todo o build e a resolução mas não
    # publica — é com ele que se valida a primeira vez sem tocar em produção.
    # Em workflow_run, inputs.dry_run é null ⇒ a condição é verdadeira.
    # Sem mudanças face ao live (needs.build.outputs.skip) ⇒ nada a publicar.
    if: >-
      needs.build.outputs.skip != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    # 5 tentativas × (deploy + 45s de espera) ≈ pior caso ~15 min.
    timeout-minutes: 20
    steps:
      # GitHub Pages API often fails transiently ("try again later") while build is fine.
      - name: Deploy to GitHub Pages (1/5)
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (2/5)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (3/5)
        id: deployment3
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before retry
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment2.outcome == 'failure' &&
          steps.deployment3.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (4/5)
        id: deployment4
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment2.outcome == 'failure' &&
          steps.deployment3.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Wait before retry
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment2.outcome == 'failure' &&
          steps.deployment3.outcome == 'failure' &&
          steps.deployment4.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (5/5)
        id: deployment5
        if: >-
          steps.deployment.outcome == 'failure' &&
          steps.deployment2.outcome == 'failure' &&
          steps.deployment3.outcome == 'failure' &&
          steps.deployment4.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true

      - name: Publish deployment URL
        id: publish
        if: always()
        env:
          URL1: ${{ steps.deployment.outputs.page_url }}
          URL2: ${{ steps.deployment2.outputs.page_url }}
          URL3: ${{ steps.deployment3.outputs.page_url }}
          URL4: ${{ steps.deployment4.outputs.page_url }}
          URL5: ${{ steps.deployment5.outputs.page_url }}
          OC1: ${{ steps.deployment.outcome }}
          OC2: ${{ steps.deployment2.outcome }}
          OC3: ${{ steps.deployment3.outcome }}
          OC4: ${{ steps.deployment4.outcome }}
          OC5: ${{ steps.deployment5.outcome }}
        run: |
          # O deploy-pages emite page_url ANTES de confirmar a publicação — uma
          # tentativa que termina em deployment_failed deixa URL não vazia.
          # Aceitar só a URL de uma tentativa com outcome success: sem isto o
          # job ficava verde sem nada publicado (e o cleanup abaixo apagava o
          # artifact, quebrando o re-run manual).
          for pair in "$OC1|$URL1" "$OC2|$URL2" "$OC3|$URL3" "$OC4|$URL4" "$OC5|$URL5"; do
            oc="${pair%%|*}"
            url="${pair#*|}"
            if [ "$oc" = "success" ] && [ -n "$url" ]; then
              echo "page_url=$url" >> "$GITHUB_OUTPUT"
              echo "Deployed to $url"
              exit 0
            fi
          done
          echo "::error::GitHub Pages deploy failed after 5 attempts (transient API error). Re-run this workflow from Actions."
          exit 1

      # O artifact github-pages (~270 MB por deploy) só alimenta o deploy-pages
      # dentro desta run — com ~10-14 deploys/dia e retenção mínima de 1 dia
      # acumulava ~3,8 GB permanentes de lixo (nov 2026: 6,8 GB no total de
      # artifacts, mais de metade destes). Apaga-se aqui em sucesso; em falha
      # fica para o re-run manual do job (o publish falha o job ⇒ success()
      # false ⇒ não apagamos) e expira sozinho em 1 dia.
      # Nota: este passo nunca pode falhar o job — uma falha da API aqui não
      # pode bloquear os verificadores pós-publicação (security-headers etc.)
      # nem pintar de vermelho um deploy que já está live. Qualquer erro vira
      # warning: o artifact expira sozinho em 1 dia.
      - name: Delete pages artifact
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! artifact_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' 2>/dev/null | head -n1); then
            echo "::warning::não foi possível listar artifacts da run — github-pages expira em 1 dia"
            exit 0
          fi
          if [ -z "$artifact_id" ]; then
            echo "sem artifact github-pages nesta run — nada a apagar"
            exit 0
          fi
          if gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id" > /dev/null 2>&1; then
            echo "github-pages artifact $artifact_id apagado"
          else
            echo "::warning::delete do artifact $artifact_id recusado — expira sozinho em 1 dia"
          fi

  security-headers:
    # Guard S7 (docs/SECURITY-HEADERS.md §4.1) — corre o verificador após o deploy
    # e falha o run se algum header estiver ausente. O checker falha de propósito
    # contra o GitHub Pages puro (estado pré-S7), por isso o job é saltado enquanto
    # a repo variable S7_PROXY_ENABLED não for 'true' (Settings → Secrets and
    # variables → Actions → Variables) — ativar só depois do proxy estar aplicado.
    # Em dry_run o deploy é saltado, logo este job também.
    if: vars.S7_PROXY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: deploy
    # 6 tentativas × 20s de espera ≈ pior caso ~10 min.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 1

      - name: Check S7 security headers in production (retries para o edge)
        env:
          BASE_URL: ${{ vars.S7_HEADERS_BASE_URL || 'https://ventu.surf' }}
        run: |
          attempts=6
          delay=20
          for i in $(seq 1 "$attempts"); do
            echo "==> Tentativa $i/$attempts — $BASE_URL"
            if bash scripts/check-security-headers.sh "$BASE_URL"; then
              echo "OK — headers S7 conforme em produção ($BASE_URL)"
              exit 0
            fi
            [ "$i" -lt "$attempts" ] || break
            echo "Headers ainda não presentes; a aguardar ${delay}s antes de revalidar..."
            sleep "$delay"
          done
          echo "::error::Headers S7 ausentes após $attempts tentativas em $BASE_URL — proxy Cloudflare/Transform Rules não aplicados ou regrediram (docs/SECURITY-HEADERS.md §4.1)."
          exit 1
