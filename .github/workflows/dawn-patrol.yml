name: Dawn Patrol AI Advisor

on:
  # Sequencial: dispara quando o update-data.yml do mesmo dia COMPLETA com
  # sucesso — concretamente a corrida das 04:00 Lisboa, o último merge antes
  # das 06:00 (05:00 é 'skip' no schedule). Assim a recalibração apanha sempre
  # as leituras mais frescas do merge antes do dawn, sem correr em paralelo
  # nem depender de um cron independente que possa acordar antes do update.
  workflow_run:
    workflows: [Update VenTu Data]
    types: [completed]
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  actions: write # gh workflow run deploy.yml quando o push aterra (#455)

concurrency:
  group: dawn-patrol
  cancel-in-progress: false

jobs:
  generate-dawn-patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Só avança com o update-data concluído com SUCESSO (ou dispatch manual):
    # update-data a falhar → sem merge fresco → sem dawn patrol esse dia.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Hydrate public/data (ventu-data)
        run: git fetch origin ventu-data --depth=1 && git checkout FETCH_HEAD -- public/data data-state || true

      # O workflow_run dispara para TODAS as corridas diárias do update-data
      # (00h, 04h, 06h, 08h, …). Este gate restringe o dawn patrol à janela da
      # corrida das 04:00 Lisboa — a última antes das 06:00.
      - name: Dawn window gate (Europe/Lisbon)
        id: gate
        run: node scripts/should-run-dawn-patrol.js

      - name: Setup Node.js
        if: steps.gate.outputs.gate == 'run'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.gate == 'run'
        run: npm ci

      - name: Generate Dawn Patrol
        if: steps.gate.outputs.gate == 'run'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS }}
        run: node scripts/dawn-patrol.js

      - name: Commit and push (with retry)
        if: steps.gate.outputs.gate == 'run'
        id: push
        # Padrão dos outros bots (update-news/apply-contributions): rebase a
        # cada tentativa (um push de dados pode aterrar entre o checkout e o
        # push) e exit 1 se todas falharem — o loop anterior engolia a falha
        # (o exit status do `sleep` final era 0 → step verde sem push).
        run: |
          # Publica na branch órfão ventu-data (nunca na main) — plumbing
          # puro, branch de 1 commit, sem tocar na working tree.
          # O fetch ANTES do PRE_SHA é obrigatório: o checkout é single-branch
          # e origin/ventu-data só existe no clone depois do fetch — medir o
          # PRE sem ele dava "" e marcava pushed=true até no "Nada a publicar".
          git fetch origin ventu-data --depth=1 || true
          PRE_SHA=$(git rev-parse -q --verify "origin/ventu-data:public/data/dawn-patrol.json" 2>/dev/null || true)
          bash scripts/push-data-file.sh \
            "auto: dawn patrol $(date +%Y-%m-%d)" \
            public/data/dawn-patrol.json
          # O blob do ficheiro no branch muda só quando o push aterra de
          # facto — distingue o "Published" do "Nada a publicar" sem parsear
          # o log do script. O script re-fez fetch no fim → POST lê a ponta.
          POST_SHA=$(git rev-parse -q --verify "origin/ventu-data:public/data/dawn-patrol.json" 2>/dev/null || true)
          if [ -n "$POST_SHA" ] && [ "$POST_SHA" != "$PRE_SHA" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # O deploy saiu do workflow_run do deploy.yml (#455): em vez de cada
      # conclusão do Dawn Patrol (incl. gate=skip) disparar um segundo deploy,
      # só um push real de dawn-patrol.json o despacha — e só se a ponta de
      # main tiver CI verde. O dispatch resolve a main directamente (sem
      # prova de verde, é decisão humana); um bot não pode publicar código
      # sem CI. Se a main ainda não tiver verde, o próximo CI verde publica
      # o boletim no deploy do workflow_run — nada se perde.
      - name: Dispatch deploy
        if: steps.gate.outputs.gate == 'run' && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAIN_SHA=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          GREEN_SHA=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$MAIN_SHA" ] || [ -z "$GREEN_SHA" ]; then
            echo "::notice::Sem prova de CI verde na main — o próximo CI publica o boletim."
            exit 0
          fi
          if [ "$GREEN_SHA" != "$MAIN_SHA" ]; then
            echo "::notice::Último CI verde ($GREEN_SHA) atrás da main ($MAIN_SHA) — adiar para o próximo CI."
            exit 0
          fi
          gh workflow run deploy.yml
