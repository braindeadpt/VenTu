name: Dawn Patrol AI Advisor

on:
  schedule:
    # Run every day at 6:00 AM Lisbon time (5:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  generate-dawn-patrol:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Dawn Patrol
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS }}
        run: node scripts/dawn-patrol.js

      - name: Commit and push (with retry)
        run: |
          git config user.name "VenTu Bot"
          git config user.email "bot@ventu.surf"
          git add -f public/data/dawn-patrol.json
          git diff --staged --quiet || (
            git commit -m "auto: dawn patrol $(date +%Y-%m-%d)"
            for i in 1 2 3 4 5; do
              git push && break
              sleep $((i * 10))
            done
          )
