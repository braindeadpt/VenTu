name: Telegram Link Poll

# Lightweight poll so /start deep-links activate within ~5 min (no always-on server).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 288 runs/dia: um run pendurado não pode sobrepor-se ao tick seguinte
  # (o offset getUpdates vive no Supabase — polls concorrentes liam o mesmo
  # offset e reprocessavam updates). cancel-in-progress é seguro: o offset
  # só é gravado no fim, pelo que um cancel reprocessa de forma idempotente.
  group: telegram-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Require TELEGRAM_BOT_TOKEN
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            echo "TELEGRAM_BOT_TOKEN missing — skip poll (no-op)."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Skip if Supabase is not configured
        # Only evaluated when the token exists — never overrides a token skip.
        if: env.skip != 'true'
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "Supabase secrets missing — telegram link poll is a no-op (exit 0)."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Poll Telegram /start links
        if: env.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npm run telegram:poll
