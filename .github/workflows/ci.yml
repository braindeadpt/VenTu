name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high

      - name: Validate spots
        run: node scripts/validate-spots.js

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Generate sitemap
        run: npm run sitemap:generate

      - name: Build spots index
        run: npm run spots:index && npm run spots:lite

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_OBS_WORKER_URL: ${{ vars.NEXT_PUBLIC_OBS_WORKER_URL || 'https://ventu-observations.busntech-net.workers.dev' }}
        run: npm run build

      - name: Lighthouse audit (perf, a11y, SEO)
        run: node scripts/run-lighthouse-prod.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E — critical routes
        run: npx playwright test critical-routes
        env:
          CI: true

      - name: E2E — route audit
        run: npx playwright test full-audit
        env:
          CI: true

      - name: E2E — visual UX audit
        run: npx playwright test visual-ux-audit
        env:
          CI: true
