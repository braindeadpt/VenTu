name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high+)
        run: npm audit --audit-level=high

      - name: Validate spots
        run: node scripts/validate-spots.js

      - name: Validate page slugs (explorar/modalidades URL segments)
        run: node scripts/validate-page-slugs.js

      - name: Validate news/livecam URL segments
        run: node scripts/validate-news-livecams.js

      - name: Validate data files (UTF-8 + JSON)
        run: node scripts/validate-data-files.js

      # Guard: o CITATION.cff (raiz) é o que o GitHub mostra em «Cite this
      # repository» — valida cff-version, campos obrigatórios, authors e a
      # preferred-citation com DOI bem formado. Pure-node, corre cedo no CI.
      - name: Validate CITATION.cff
        run: node scripts/check-citation-cff.js

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Guard: re-runs ONLY the three slug-guard suites (few seconds) and
      # asserts their exact test counts — deleting a guard test file, its
      # vitest.config entry, or the validator it covers would otherwise
      # shrink the suite with CI still green.
      - name: Guard suites ran with expected counts
        run: node scripts/check-guard-test-counts.js

      - name: Generate sitemap
        run: npm run sitemap:generate

      # Guard: o sitemap é um ficheiro GERADO (scripts/generate-sitemap.js) e
      # nunca deve ser editado à mão. Falha quando o public/sitemap.xml commitado
      # diverge estruturalmente do gerador (novo spot/notícia/rota esquecidos,
      # hreflang em falta) — ignora o <lastmod> (o gerador grava a data de hoje).
      - name: Sitemap drift guard
        run: node scripts/check-sitemap-drift.js

      - name: Build spots index
        run: npm run spots:index && npm run spots:lite

      - name: Cache Next.js build cache (.next/cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          # Key = s├│ o lock hash (n├úo github.sha): PRs, pushes e data-commits
          # partilham a MESMA entrada ÔÇö exact hit sempre que o lock n├úo muda.
          # Em mudan├ºa de depend├¬ncias, o prefixo restaura o cache anterior.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_OBS_WORKER_URL: ${{ vars.NEXT_PUBLIC_OBS_WORKER_URL || 'https://ventu-observations.busntech-net.workers.dev' }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_API_KEY }}
        run: npm run build

      - name: Assert no nested segment-cache payload dirs remain
        run: node scripts/check-segment-paths.js

      - name: Validate _headers security directives
        run: node scripts/check-headers-file.js

      # Blocking perf/a11y/SEO gate: category floors (SEO≥90, A11y≥85,
      # Perf≥50) AND audit-level Core Web Vitals budgets (FCP≤900ms, LCP≤3.5s,
      # SI≤3.2s, TBT≤250ms, ≤2MB page weight) — calibrated from measured runs,
      # evaluated in scripts/lib/lighthouseBudgets.js (unit-tested, pure).
      # CLS is tracked+printed but not gated until the spot-page hydration
      # shift (0.44) is fixed.
      - name: Lighthouse budgets (perf, a11y, SEO, CWV)
        run: npm run lighthouse:prod

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E — critical routes
        run: npx playwright test critical-routes
        env:
          CI: true

      # Specs herméticos de dados/score (interceptam data files client-side —
      # correm sem rede nem IH_API_KEY): core expandido com tides, buoy-warnings,
      # topnow-wave-badge, observed-wave-card, data-sources, isobaths,
      # coastal-nav-warnings e coastal-map-layer.
      - name: E2E — core data/score specs (hermetic)
        run: npm run test:e2e:core
        env:
          CI: true

      - name: E2E — route audit
        run: npx playwright test full-audit
        env:
          CI: true

      - name: E2E — visual UX audit
        run: npx playwright test visual-ux-audit
        env:
          CI: true

      # Visual regression (toHaveScreenshot, zero-diff). Baselines are
      # platform-bound: CI runs on ubuntu-latest, so baselines must be
      # recorded on Linux (`npm run test:visual:update` in a Linux checkout
      # or via act) before this step can gate. The step self-skips when no
      # Linux baselines are committed yet so a new contributor's first build
      # isn't red for missing PNGs.
      - name: Check visual baselines exist (Linux)
        id: visual_baselines
        run: |
          count=$(find tests/e2e/visual-regression.spec.ts-snapshots -name '*-linux.png' 2>/dev/null | wc -l)
          echo "baselines=$count" >> "$GITHUB_OUTPUT"
          echo "Linux visual baselines: $count"

      - name: E2E — visual regression (pixel gate)
        if: steps.visual_baselines.outputs.baselines != '0'
        run: npm run test:visual
        env:
          CI: true

  supabase-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ventu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run Supabase SQL integration tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: ventu_test
        run: bash supabase/tests/run-tests.sh

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform

      # init -backend=false: valida os schemas do provider sem tocar em state
      # nem aplicar nada (o m├│dulo n├úo tem backend; s├│ descarrega o provider).
      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform

      # Valida a sintaxe das express├Áes WAF (ruleset engine) de todos os
      # terraform/*.tf + docs/SECURITY-HEADERS.md (equival├¬ncias) sem token da
      # API, e o drift entre os dois (doc = fonte de verdade) ÔÇö um erro de
      # express├úo s├│ seria apanhado no apply, que aqui nunca corre.
      - name: Validate WAF expressions (ruleset engine syntax)
        run: node scripts/validate-terraform-expressions.js

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      # Os 4 scripts bash do repo (checker S7, monitor IH, push-data-update,
      # runner de testes SQL) ÔÇö sem findings, o job passa.
      - name: Lint bash scripts (shellcheck)
        run: |
          shellcheck scripts/check-security-headers.sh \
            scripts/monitor-ih-tides.sh \
            scripts/push-data-update.sh \
            supabase/tests/run-tests.sh
