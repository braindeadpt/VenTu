name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
  workflow_dispatch:

permissions:
  contents: read

# Só o commit mais recente interessa: um push novo torna o run anterior
# obsoleto (e o deploy publica o SHA cujo CI passou — um run cancelado nunca
# publica). Poupa minutos de runner em rajadas de pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O antigo job único «quality» (~35 min em série) foi dividido: verificações
  # estáticas, build live e build da fixture visual correm em paralelo; depois
  # os testes de browser correm em jobs paralelos sobre o export (artefacto).
  # Os gates são os mesmos — nenhum passo foi retirado nem afrouxado; só deixam
  # de esperar uns pelos outros. O repo é público: os minutos são gratuitos.

  # Verificações sem build nem browser (audit, validadores, lint, unit, tsc).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Hydrate public/data (ventu-data)
        run: git fetch origin ventu-data --depth=1 && git checkout FETCH_HEAD -- public/data data-state || true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high+)
        # npm 10 hits the retiring /security/audits/quick endpoint, which the
        # registry now answers with 400/503 intermittently (retirement notice:
        # "use the bulk advisory endpoint instead"). npm 11 audits via the bulk
        # endpoint — proven working locally (0 vulnerabilities). The registry
        # has also been flaky today (503 / network timeouts), so endpoint
        # errors are retried with backoff. The gate stays honest: a real high+
        # finding fails immediately, and 5 endpoint failures still fail the step.
        #
        # Allowlist (advisory GHSA id → remove when a patched release lands):
        #   GHSA-vfj7-8cjw-p6xm — braces ≤3.0.3 stack-exhaustion DoS. No patched
        #   release exists (micromatch/braces#70). Dev-only transitive dep
        #   (chokidar/fast-glob globs); unreachable in the static-export site.
        #   GHSA-fc5q-39xc-vjpf — picomatch ≤4.0.7 ReDoS (repeated extglobs). No
        #   patched release yet. Every copy in the lockfile is dev-only (vite,
        #   vitest, tinyglobby, chokidar); it never ships in the static export.
        run: |
          npm install -g npm@11 >/dev/null 2>&1 || true
          for i in 1 2 3 4 5; do
            out=$(npm audit --json 2>&1) || true
            if printf '%s\n' "$out" | grep -q '"auditReportVersion"'; then
              printf '%s\n' "$out" | node -e '
                let d = "";
                process.stdin.on("data", (c) => (d += c)).on("end", () => {
                  const allow = new Set(["GHSA-vfj7-8cjw-p6xm", "GHSA-fc5q-39xc-vjpf"]);
                  const bad = [];
                  for (const [name, v] of Object.entries(
                    JSON.parse(d).vulnerabilities || {},
                  )) {
                    for (const via of Array.isArray(v.via) ? v.via : [v.via]) {
                      if (
                        via && typeof via === "object" &&
                        ["high", "critical"].includes(via.severity) &&
                        !allow.has((via.url || "").split("/").pop())
                      ) {
                        bad.push(`${name} (${via.url || via.title || "?"})`);
                      }
                    }
                  }
                  if (bad.length) {
                    console.log("high+ advisories outside allowlist:");
                    for (const b of bad) console.log("  " + b);
                    process.exit(1);
                  }
                  console.log("audit clean (allowlisted advisories only)");
                });'
              exit $?
            fi
            if printf '%s\n' "$out" | grep -qE "audit endpoint returned an error|network timeout|Service Unavailable|Bad Request|ECONNRESET|ETIMEDOUT"; then
              echo "registry audit endpoint flake (attempt ${i}/5) — retrying"
              sleep 20
            else
              printf '%s\n' "$out"
              exit 1
            fi
          done
          echo "npm audit could not reach the registry after 5 attempts (no vulnerability findings)"
          exit 1

      - name: Validate spots
        run: node scripts/validate-spots.js

      - name: Spots catalog in sync (spots.ts regenerated from spots.json)
        run: npm run spots:catalog:check

      - name: Validate page slugs (explorar/modalidades URL segments)
        run: node scripts/validate-page-slugs.js

      - name: Validate news/livecam URL segments
        run: node scripts/validate-news-livecams.js

      - name: Validate data files (UTF-8 + JSON)
        run: node scripts/validate-data-files.js

      # Guard: o CITATION.cff (raiz) é o que o GitHub mostra em «Cite this
      # repository» — valida cff-version, campos obrigatórios, authors e a
      # preferred-citation com DOI bem formado. Pure-node, corre cedo no CI.
      - name: Validate CITATION.cff
        run: node scripts/check-citation-cff.js

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # M1 (auditoria): o tsconfig exclui tests/e2e e worker, pelo que nenhum
      # dos dois era type-checkado em CI. Passa a haver um tsconfig próprio
      # para os specs e o typecheck do worker com as suas devDeps.
      - name: Typecheck e2e specs
        run: npx tsc --noEmit -p tests/e2e

      - name: Typecheck worker (Cloudflare)
        run: |
          npm ci --prefix worker --ignore-scripts
          npx tsc --noEmit -p worker

      # Guard: re-runs ONLY the three slug-guard suites (few seconds) and
      # asserts their exact test counts — deleting a guard test file, its
      # vitest.config entry, or the validator it covers would otherwise
      # shrink the suite with CI still green.
      - name: Guard suites ran with expected counts
        run: node scripts/check-guard-test-counts.js

      # Guard (auditoria de acessibilidade do mapa): nos controlos de camada o
      # nome acessível é o MODO e nunca o estado — o estado vive no
      # aria-pressed. Um aria-label alternado («Mostrar vento» ↔ «Ocultar
      # vento») faz o leitor de ecrã anunciar o contrário do que está ligado.
      # A regra já foi reintroduzida três vezes (cluster, «só a bombar»,
      # camadas do HUD) — passo estático, sem browser, alguns milissegundos.
      - name: Map layer controls keep constant names (nome=modo, state in aria-pressed)
        run: node scripts/check-map-layer-names.js

      # LOW8: cada função public.* só pode estar definida num ficheiro SQL —
      # is_ventu_admin() andou copiada verbatim em 3 antes do fix.
      - name: Validate SQL function definitions (no drift)
        run: node scripts/check-sql-function-drift.js

      # M8: tecto para a árvore trackeada de public/data (o histórico cresce
      # ~2×/hora com forecasts + frames de radar — ver docs/DATA-HISTORY.md).
      - name: Validate public/data history budget
        run: node scripts/check-data-history-budget.js

      # Guard: o sitemap é um ficheiro GERADO (scripts/generate-sitemap.js) e
      # nunca deve ser editado à mão. Falha quando o public/sitemap.xml commitado
      # diverge estruturalmente do gerador (novo spot/notícia/rota esquecidos,
      # hreflang em falta) — ignora o <lastmod> (o gerador grava a data de hoje).
      # A comparação corre inteira no espaço versionado (git show HEAD: dos
      # inputs + do sitemap): o hydrate de ventu-data traz notícias novas todos
      # os dias — gerar sobre a working tree tornava o guard um alvo móvel
      # (devin-review #568).
      - name: Sitemap drift guard
        run: node scripts/check-sitemap-drift.js


  # Export live (o que é publicado e medido pelo Lighthouse e pelos e2e).
  build:
    runs-on: ubuntu-latest
    # Backstop de segurança (incidente 2026-09-09): sem limite o default é 6h.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Hydrate public/data (ventu-data)
        run: git fetch origin ventu-data --depth=1 && git checkout FETCH_HEAD -- public/data data-state || true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap
        run: npm run sitemap:generate

      - name: Build spots index
        run: npm run spots:index && npm run spots:lite

      - name: Cache Next.js build cache (.next/cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          # Key = só o lock hash (não github.sha): PRs, pushes e data-commits
          # partilham a MESMA entrada — exact hit sempre que o lock não muda.
          # Em mudança de dependências, o prefixo restaura o cache anterior.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SITE_URL: 'https://ventu.surf'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_OBS_WORKER_URL: ${{ vars.NEXT_PUBLIC_OBS_WORKER_URL || 'https://ventu-observations.busntech-net.workers.dev' }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_API_KEY }}
        run: npm run build

      - name: Assert no nested segment-cache payload dirs remain
        run: node scripts/check-segment-paths.js

      - name: Validate _headers security directives
        run: node scripts/check-headers-file.js

      # Per-route payload budgets: listing pages must never re-serialize the
      # spot-detail forecast bake (847350f9c → ~22 MB/route; fixed by
      # cb6fb1806). Fails the build if any route dir exceeds 5 MB raw.
      - name: Check per-route payload budgets
        # Dois passes: os budgets do export cozido (out/) e os mesmos
        # budgets aplicados ao public/data hidratado da ventu-data — a fonte
        # pode inchar sem que o bake o sinalize (#464).
        run: |
          node scripts/check-payload-budgets.js
          node scripts/check-payload-budgets.js --data-dir public/data

      # Export-route validator (browserless): every sitemap + noindex
      # allowlist route must have a baked index.html, none may have baked the
      # not-found page, none near-empty, none orphaned. Replaces the HTTP
      # half of the route audit (~14 min of per-route navigation) with a
      # filesystem check of all ~2300 routes in seconds. The browser audit
      # below keeps uncaught-JS coverage on a deterministic stratified sample.
      - name: Check export routes (all, browserless)
        run: node scripts/check-export-routes.js

      # Hydration beacon in the BUILT bundle: the CSS gates and waitHydrated
      # hang off html.is-hydrated. The vitest contract guards the source, but
      # only the bundle proves the beacon shipped — a build that drops it
      # leaves the favorite hearts, news shell and dawn-patrol slots hidden
      # in prod (the gates never open) while staying green.
      - name: Assert hydration beacon is-hydrated setter in the bundle
        run: node scripts/check-hydration-beacon.js

      # Um único ficheiro comprimido: o out/ tem milhares de ficheiros e o
      # upload-artifact por ficheiro seria muito mais lento que um tar.
      - name: Pack export
        run: tar -I 'zstd -T0 -3' -cf out.tar.zst out

      - name: Upload export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out-live
          path: out.tar.zst
          compression-level: 0
          retention-days: 1

  # Export dedicado ao pixel gate: a fixture em public/data e relógio congelado.
  # Corre em paralelo com o build live (antes era um segundo build em série).
  build-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      baselines: ${{ steps.visual_baselines.outputs.baselines }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Hydrate public/data (ventu-data)
        run: git fetch origin ventu-data --depth=1 && git checkout FETCH_HEAD -- public/data data-state || true

      # Visual regression (toHaveScreenshot, zero-diff). Baselines are
      # platform-bound: CI runs on ubuntu-latest, so baselines must be
      # recorded on Linux before this gate can run. With no Linux baselines
      # committed the pixel gate self-skips.
      - name: Check visual baselines exist (Linux)
        id: visual_baselines
        run: |
          count=$(find tests/e2e/visual-regression.spec.ts-snapshots -name '*-linux.png' 2>/dev/null | wc -l)
          echo "baselines=$count" >> "$GITHUB_OUTPUT"
          echo "Linux visual baselines: $count"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap
        run: npm run sitemap:generate

      - name: Build spots index
        run: npm run spots:index && npm run spots:lite

      - name: Cache Next.js build cache (.next/cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Rebuild export with the visual fixture (pixel gate only)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SITE_URL: 'https://ventu.surf'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_OBS_WORKER_URL: ${{ vars.NEXT_PUBLIC_OBS_WORKER_URL || 'https://ventu-observations.busntech-net.workers.dev' }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_API_KEY }}
          # Relógio do build congelado dentro das séries da fixture (24/25–31 Out):
          # janelas, régua e bakedAtMs deixam de depender da hora a que o CI corre.
          # = hora do build das baselines actuais (record 40494119788, 27/10 ~11:13 WET).
          # Mesmo valor nos dois workflows (src/lib/buildClock.ts).
          VENTU_BUILD_NOW: '2026-10-27T11:13:30Z'
        run: |
          node scripts/overlay-visual-fixture.mjs
          npm run build

      # Um único ficheiro comprimido: o out/ tem milhares de ficheiros e o
      # upload-artifact por ficheiro seria muito mais lento que um tar.
      - name: Pack export
        run: tar -I 'zstd -T0 -3' -cf out.tar.zst out

      - name: Upload export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: out-visual
          path: out.tar.zst
          compression-level: 0
          retention-days: 1

  # Testes de browser sobre o export live, em paralelo. O core é dividido em
  # 3 shards (por ficheiro de spec); o resto (rotas críticas, route audit,
  # UX audit, latência de hidratação) cabe num job.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: core
            shard: 1/3
          - suite: core
            shard: 2/3
          - suite: core
            shard: 3/3
          - suite: rotas
            shard: '-'
          - suite: v6
            shard: '-'
    name: e2e (${{ matrix.suite }} ${{ matrix.shard }})
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Hydrate public/data (ventu-data)
        run: git fetch origin ventu-data --depth=1 && git checkout FETCH_HEAD -- public/data data-state || true

      - name: Preparar export (out-live)
        uses: ./.github/actions/preparar-export
        with:
          artefacto: out-live
          chromium: 'true'

      # Hydration-latency metric (report only, fails nothing).
      - name: Measure hydration latency (report only)
        if: matrix.suite == 'rotas'
        run: node scripts/measure-hydration-latency.mjs --serve out --runs 3 >> $GITHUB_STEP_SUMMARY
        env:
          CI: true

      - name: E2E — critical routes
        if: matrix.suite == 'rotas'
        run: npx playwright test critical-routes
        env:
          CI: true

      # Specs herméticos de dados/score (interceptam data files client-side —
      # correm sem rede nem IH_API_KEY): core expandido com tides, buoy-warnings,
      # topnow-wave-badge, observed-wave-card, data-sources, isobaths,
      # coastal-nav-warnings, coastal-map-layer e map-unmount-race.
      # O `timeout 900` é a barreira OS-level (SIGTERM aos 15 min, exit 124):
      # o globalTimeout do Playwright cobre hangs do runner, mas um processo
      # bloqueado em I/O escapa a timers internos — este garante a morte do
      # processo e falha o step com sinal claro (incidente 2026-09-09).
      # M4 (auditoria): o core passou a incluir os 10 specs herméticos que só
      # corriam à mão (about-coherence-trend, compare-calibration,
      # dawn-patrol-hero-score, home-map-first, homepage-redesign,
      # map-explore-sheet, map-score-factors, map-tiles, spot-hero-gauge,
      # wind-ring-legend) — corridos a verde com CI=1 antes de entrar.
      # ipma-radar-carousel entrou no core (auditoria 2026-09-21): os 28 testes
      # correm a verde porque o spec é hermético — stub de radar.json via
      # interceptRadar (o mesmo do map-hud) e relógio congelado ANTES da
      # navegação. As duas falhas que o mantinham fora eram do próprio spec
      # (corrida de timers + toggle procurado no peek, onde a grelha de camadas
      # não é renderizada), não do carrossel.
      # Ficam de fora, por dependerem de dados vivos e falharem sem eles
      # (intencionalmente manuais): about-wave-bias, map-wind-markers. O
      # axe-audit é opt-in (npm run test:e2e:axe) e o audit diário corre
      # full-audit.*.
      - name: E2E — core data/score specs (hermetic)
        if: matrix.suite == 'core'
        run: timeout 900 npm run test:e2e:core -- --shard=${{ matrix.shard }}
        env:
          CI: true

      # Suite v6 (#464): os 18 specs map-pele-*/home-v6/spot-v6/nivel-ui/
      # noite-fora-mapa/map-night/score-scale/foto-credito-mobile correm
      # obrigatoriamente em cada PR — viviam fora do @core desde a
      # iniciativa v6 e a PR B9 quebrou map-pele-paridade sem o CI ver.
      - name: E2E — pele v6 / map-pele specs
        if: matrix.suite == 'v6'
        run: timeout 900 npm run test:e2e:v6
        env:
          CI: true


      # Deterministic stratified sample (spot 40 / news 20 / explorar 15;
      # static + modalidade always full). Full browser run is the daily
      # full-route-audit workflow (VENTU_FULL_AUDIT=1).
      - name: E2E — route audit (stratified sample)
        if: matrix.suite == 'rotas'
        run: npx playwright test full-audit
        env:
          CI: true

      - name: E2E — visual UX audit
        if: matrix.suite == 'rotas'
        run: npx playwright test visual-ux-audit
        env:
          CI: true

      - name: Upload E2E artifacts (test-results)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results-${{ github.job }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  # Pixel gate (zero-diff) sobre o export da fixture. O spec é um só ficheiro
  # com testes independentes: --fully-parallel deixa os 2 workers e os 3
  # shards dividirem-no por teste (sem isso corria todo num só worker).
  pixel:
    needs: build-visual
    if: needs.build-visual.outputs.baselines != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    name: pixel (${{ matrix.shard }})
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Hydrate public/data (ventu-data)
        run: git fetch origin ventu-data --depth=1 && git checkout FETCH_HEAD -- public/data data-state || true

      - name: Preparar export (out-visual)
        uses: ./.github/actions/preparar-export
        with:
          artefacto: out-visual
          chromium: 'true'

      # O spec serve /data/** da fixture; o overlay mantém public/data igual
      # ao do build que gerou o export, como no job único antigo.
      - name: Overlay visual fixture
        run: node scripts/overlay-visual-fixture.mjs

      - name: E2E — visual regression (pixel gate)
        run: npm run test:visual -- --fully-parallel --shard=${{ matrix.shard }}
        env:
          CI: true

      - name: Upload E2E artifacts (test-results)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results-${{ github.job }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Hydrate public/data (ventu-data)
        run: git fetch origin ventu-data --depth=1 && git checkout FETCH_HEAD -- public/data data-state || true

      - name: Preparar export (out-live)
        uses: ./.github/actions/preparar-export
        with:
          artefacto: out-live
          chromium: 'true'

      # Blocking perf/a11y/SEO gate: category floors (SEO≥90, A11y≥85,
      # Perf≥50) AND audit-level Core Web Vitals budgets (FCP≤900ms, LCP≤3.5s,
      # SI≤3.2s, TBT≤250ms, ≤2MB page weight) — calibrated from measured runs,
      # evaluated in scripts/lib/lighthouseBudgets.js (unit-tested, pure).
      # Each route is measured 3× and budgets are evaluated on the MEDIAN
      # report (scripts/run-lighthouse-prod.js): one contention spike on the
      # shared 2-core runner no longer fails the build, while a genuine
      # regression breaches the majority of runs and still fails the median.
      # Corre em paralelo com os gates de correção (unit, lint, E2E, pixel);
      # o deploy continua a exigir o workflow inteiro verde.
      # 5 measured runs: the spot page intermittently shows the documented
      # ~0.64 cold-cache CLS signature on the shared runner (one resource
      # ~37KB short → late swap/shift). A median of 5 needs a majority of bad
      # runs to breach, so a real regression still fails the gate.
      - name: Lighthouse budgets (perf, a11y, SEO, CWV)
        run: npm run lighthouse:prod
        env:
          LIGHTHOUSE_RUNS: '5'
          # 2 warm-ups: o CLS de cache fria do spot (~0.65 no <footer>)
          # precisa de mais que uma navegação para assentar em CI (ver
          # scripts/run-lighthouse-prod.js, evidência 2026-09-23).
          LIGHTHOUSE_WARMUP: '2'

      # Quando o gate rebenta, o relatório do pior run (com os elementos que
      # mexeram e as requisições tardias) fica como artefacto: é o único sítio
      # onde a assinatura de CLS do runner partilhado se reproduz.
      - name: Upload Lighthouse diagnostics (failure only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-diagnostics
          path: lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 7

  supabase-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ventu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Hydrate public/data (ventu-data)
        run: git fetch origin ventu-data --depth=1 && git checkout FETCH_HEAD -- public/data data-state || true

      - name: Install psql client
        # apt-get update pode sair 100 por um índice de terceiros inconsistente
        # (dl.google.com/chrome: "Hash Sum mismatch", flake 2026-09-09) — os
        # índices Ubuntu úteis ficam atualizados na mesma; o install é que decide.
        run: |
          sudo apt-get update || echo "::warning::apt-get update devolveu erro de índice (flake conhecido de terceiros) — a continuar com as listas disponíveis"
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run Supabase SQL integration tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: ventu_test
        run: bash supabase/tests/run-tests.sh

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Hydrate public/data (ventu-data)
        run: git fetch origin ventu-data --depth=1 && git checkout FETCH_HEAD -- public/data data-state || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform

      # init -backend=false: valida os schemas do provider sem tocar em state
      # nem aplicar nada (o módulo não tem backend; só descarrega o provider).
      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform

      # Valida a sintaxe das expressões WAF (ruleset engine) de todos os
      # terraform/*.tf + docs/SECURITY-HEADERS.md (equivalências) sem token da
      # API, e o drift entre os dois (doc = fonte de verdade) — um erro de
      # expressão só seria apanhado no apply, que aqui nunca corre.
      - name: Validate WAF expressions (ruleset engine syntax)
        run: node scripts/validate-terraform-expressions.js

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Hydrate public/data (ventu-data)
        run: git fetch origin ventu-data --depth=1 && git checkout FETCH_HEAD -- public/data data-state || true

      - name: Install shellcheck
        # Mesmo tratamento do flake de índice de terceiros (ver job supabase-sql).
        run: |
          sudo apt-get update || echo "::warning::apt-get update devolveu erro de índice (flake conhecido de terceiros) — a continuar com as listas disponíveis"
          sudo apt-get install -y --no-install-recommends shellcheck

      # Os 4 scripts bash do repo (checker S7, monitor IH, push-data-update,
      # runner de testes SQL) — sem findings, o job passa.
      - name: Lint bash scripts (shellcheck)
        run: shellcheck scripts/*.sh supabase/tests/run-tests.sh
