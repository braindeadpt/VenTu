name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate spots
        run: node scripts/validate-spots.js

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Generate sitemap
        run: npm run sitemap:generate

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (critical routes + audits)
        run: npx playwright test critical-routes full-audit visual-ux-audit
        env:
          CI: true
