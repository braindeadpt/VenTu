name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
  workflow_dispatch:

permissions:
  contents: read

# Só o commit mais recente interessa: um push novo torna o run anterior
# obsoleto (e o deploy publica o SHA cujo CI passou — um run cancelado nunca
# publica). Poupa minutos de runner em rajadas de pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # Backstop de segurança (incidente 2026-09-09: e2e presos a 0s CPU): sem
    # este limite o default do GitHub é 6h — um step preso esgota o runner.
    # 45 min cobre folgado o normal (build + unit + e2e + perf ≈ 15–20 min)
    # enquanto falha cedo qualquer deadlock/hang.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high+)
        # npm 10 hits the retiring /security/audits/quick endpoint, which the
        # registry now answers with 400/503 intermittently (retirement notice:
        # "use the bulk advisory endpoint instead"). npm 11 audits via the bulk
        # endpoint — proven working locally (0 vulnerabilities). The registry
        # has also been flaky today (503 / network timeouts), so endpoint
        # errors are retried with backoff. The gate stays honest: a real high+
        # finding fails immediately, and 5 endpoint failures still fail the step.
        run: |
          npm install -g npm@11 >/dev/null 2>&1 || true
          for i in 1 2 3 4 5; do
            out=$(npm audit --audit-level=high 2>&1) && { printf '%s\n' "$out"; exit 0; }
            if printf '%s\n' "$out" | grep -qE "audit endpoint returned an error|network timeout|Service Unavailable|Bad Request|ECONNRESET|ETIMEDOUT"; then
              echo "registry audit endpoint flake (attempt ${i}/5) — retrying"
              sleep 20
            else
              printf '%s\n' "$out"
              exit 1
            fi
          done
          echo "npm audit could not reach the registry after 5 attempts (no vulnerability findings)"
          exit 1

      - name: Validate spots
        run: node scripts/validate-spots.js

      - name: Validate page slugs (explorar/modalidades URL segments)
        run: node scripts/validate-page-slugs.js

      - name: Validate news/livecam URL segments
        run: node scripts/validate-news-livecams.js

      - name: Validate data files (UTF-8 + JSON)
        run: node scripts/validate-data-files.js

      # Guard: o CITATION.cff (raiz) é o que o GitHub mostra em «Cite this
      # repository» — valida cff-version, campos obrigatórios, authors e a
      # preferred-citation com DOI bem formado. Pure-node, corre cedo no CI.
      - name: Validate CITATION.cff
        run: node scripts/check-citation-cff.js

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Guard: re-runs ONLY the three slug-guard suites (few seconds) and
      # asserts their exact test counts — deleting a guard test file, its
      # vitest.config entry, or the validator it covers would otherwise
      # shrink the suite with CI still green.
      - name: Guard suites ran with expected counts
        run: node scripts/check-guard-test-counts.js

      - name: Generate sitemap
        run: npm run sitemap:generate

      # Guard: o sitemap é um ficheiro GERADO (scripts/generate-sitemap.js) e
      # nunca deve ser editado à mão. Falha quando o public/sitemap.xml commitado
      # diverge estruturalmente do gerador (novo spot/notícia/rota esquecidos,
      # hreflang em falta) — ignora o <lastmod> (o gerador grava a data de hoje).
      - name: Sitemap drift guard
        run: node scripts/check-sitemap-drift.js

      - name: Build spots index
        run: npm run spots:index && npm run spots:lite

      - name: Cache Next.js build cache (.next/cache)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          # Key = s├│ o lock hash (n├úo github.sha): PRs, pushes e data-commits
          # partilham a MESMA entrada ÔÇö exact hit sempre que o lock n├úo muda.
          # Em mudan├ºa de depend├¬ncias, o prefixo restaura o cache anterior.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_OBS_WORKER_URL: ${{ vars.NEXT_PUBLIC_OBS_WORKER_URL || 'https://ventu-observations.busntech-net.workers.dev' }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_API_KEY }}
        run: npm run build

      - name: Assert no nested segment-cache payload dirs remain
        run: node scripts/check-segment-paths.js

      - name: Validate _headers security directives
        run: node scripts/check-headers-file.js

      # Per-route payload budgets: listing pages must never re-serialize the
      # spot-detail forecast bake (847350f9c → ~22 MB/route; fixed by
      # cb6fb1806). Fails the build if any route dir exceeds 5 MB raw.
      - name: Check per-route payload budgets
        run: node scripts/check-payload-budgets.js

      # Export-route validator (browserless): every sitemap + noindex
      # allowlist route must have a baked index.html, none may have baked the
      # not-found page, none near-empty, none orphaned. Replaces the HTTP
      # half of the route audit (~14 min of per-route navigation) with a
      # filesystem check of all ~2300 routes in seconds. The browser audit
      # below keeps uncaught-JS coverage on a deterministic stratified sample.
      - name: Check export routes (all, browserless)
        run: node scripts/check-export-routes.js

      # Hydration beacon in the BUILT bundle: the CSS gates and waitHydrated
      # hang off html.is-hydrated. The vitest contract guards the source, but
      # only the bundle proves the beacon shipped — a build that drops it
      # leaves the favorite hearts, news shell and dawn-patrol slots hidden
      # in prod (the gates never open) while staying green.
      - name: Assert hydration beacon is-hydrated setter in the bundle
        run: node scripts/check-hydration-beacon.js

      # Browser cache: ~1-2 min saved per run. Keyed on the exact Playwright
      # version from the lockfile — a version bump misses and re-installs.
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Hydration-latency metric (report-only): times html.is-hydrated
      # on the runner right where the E2E specs run, against the same
      # build and 2-core hardware the suite sees. Fails nothing — data
      # for tracking local-vs-runner hydration latency over time.
      - name: Measure hydration latency (report only)
        run: node scripts/measure-hydration-latency.mjs --serve out --runs 3 >> $GITHUB_STEP_SUMMARY
        env:
          CI: true

      - name: E2E — critical routes
        run: npx playwright test critical-routes
        env:
          CI: true

      # Specs herméticos de dados/score (interceptam data files client-side —
      # correm sem rede nem IH_API_KEY): core expandido com tides, buoy-warnings,
      # topnow-wave-badge, observed-wave-card, data-sources, isobaths,
      # coastal-nav-warnings, coastal-map-layer e map-unmount-race.
      # O `timeout 900` é a barreira OS-level (SIGTERM aos 15 min, exit 124):
      # o globalTimeout do Playwright cobre hangs do runner, mas um processo
      # bloqueado em I/O escapa a timers internos — este garante a morte do
      # processo e falha o step com sinal claro (incidente 2026-09-09).
      - name: E2E — core data/score specs (hermetic)
        run: timeout 900 npm run test:e2e:core
        env:
          CI: true

      # Deterministic stratified sample (spot 40 / news 20 / explorar 15;
      # static + modalidade always full): catches uncaught-JS/hydration
      # defects, which are template-wide. All-route HTTP coverage lives in
      # the export-route check above; the full browser run is the daily
      # full-route-audit workflow (VENTU_FULL_AUDIT=1).
      - name: E2E — route audit (stratified sample)
        run: npx playwright test full-audit
        env:
          CI: true

      - name: E2E — visual UX audit
        run: npx playwright test visual-ux-audit
        env:
          CI: true

      # Visual regression (toHaveScreenshot, zero-diff). Baselines are
      # platform-bound: CI runs on ubuntu-latest, so baselines must be
      # recorded on Linux (`npm run test:visual:update` in a Linux checkout
      # or via act) before this step can gate. The step self-skips when no
      # Linux baselines are committed yet so a new contributor's first build
      # isn't red for missing PNGs.
      - name: Check visual baselines exist (Linux)
        id: visual_baselines
        run: |
          count=$(find tests/e2e/visual-regression.spec.ts-snapshots -name '*-linux.png' 2>/dev/null | wc -l)
          echo "baselines=$count" >> "$GITHUB_OUTPUT"
          echo "Linux visual baselines: $count"

      - name: E2E — visual regression (pixel gate)
        if: steps.visual_baselines.outputs.baselines != '0'
        run: npm run test:visual
        env:
          CI: true

      - name: Upload E2E artifacts (test-results)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

      # Blocking perf/a11y/SEO gate: category floors (SEO≥90, A11y≥85,
      # Perf≥50) AND audit-level Core Web Vitals budgets (FCP≤900ms, LCP≤3.5s,
      # SI≤3.2s, TBT≤250ms, ≤2MB page weight) — calibrated from measured runs,
      # evaluated in scripts/lib/lighthouseBudgets.js (unit-tested, pure).
      # Each route is measured 3× and budgets are evaluated on the MEDIAN
      # report (scripts/run-lighthouse-prod.js): one contention spike on the
      # shared 2-core runner no longer fails the build, while a genuine
      # regression breaches the majority of runs and still fails the median.
      # Correctness gates (unit, lint, E2E, pixel) run BEFORE this perf gate —
      # a slow-but-correct app ships behind a fast-but-broken one.
      # 5 measured runs: the spot page intermittently shows the documented
      # ~0.64 cold-cache CLS signature on the shared runner (one resource
      # ~37KB short → late swap/shift). A median of 5 needs a majority of bad
      # runs to breach, so a real regression still fails the gate.
      - name: Lighthouse budgets (perf, a11y, SEO, CWV)
        run: npm run lighthouse:prod
        env:
          LIGHTHOUSE_RUNS: '5'

  supabase-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ventu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install psql client
        # apt-get update pode sair 100 por um índice de terceiros inconsistente
        # (dl.google.com/chrome: "Hash Sum mismatch", flake 2026-09-09) — os
        # índices Ubuntu úteis ficam atualizados na mesma; o install é que decide.
        run: |
          sudo apt-get update || echo "::warning::apt-get update devolveu erro de índice (flake conhecido de terceiros) — a continuar com as listas disponíveis"
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Run Supabase SQL integration tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: ventu_test
        run: bash supabase/tests/run-tests.sh

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform

      # init -backend=false: valida os schemas do provider sem tocar em state
      # nem aplicar nada (o m├│dulo n├úo tem backend; s├│ descarrega o provider).
      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform

      # Valida a sintaxe das express├Áes WAF (ruleset engine) de todos os
      # terraform/*.tf + docs/SECURITY-HEADERS.md (equival├¬ncias) sem token da
      # API, e o drift entre os dois (doc = fonte de verdade) ÔÇö um erro de
      # express├úo s├│ seria apanhado no apply, que aqui nunca corre.
      - name: Validate WAF expressions (ruleset engine syntax)
        run: node scripts/validate-terraform-expressions.js

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install shellcheck
        # Mesmo tratamento do flake de índice de terceiros (ver job supabase-sql).
        run: |
          sudo apt-get update || echo "::warning::apt-get update devolveu erro de índice (flake conhecido de terceiros) — a continuar com as listas disponíveis"
          sudo apt-get install -y --no-install-recommends shellcheck

      # Os 4 scripts bash do repo (checker S7, monitor IH, push-data-update,
      # runner de testes SQL) ÔÇö sem findings, o job passa.
      - name: Lint bash scripts (shellcheck)
        run: |
          shellcheck scripts/check-security-headers.sh \
            scripts/monitor-ih-tides.sh \
            scripts/monitor-ipma-radar.sh \
            scripts/push-data-update.sh \
            supabase/tests/run-tests.sh
