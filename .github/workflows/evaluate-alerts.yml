name: Evaluate Alerts

on:
  schedule:
    # Immediate alerts — every 3h (with conditions update)
    - cron: '15 */3 * * *'
    # Daily digest — 07:30 UTC (GitHub ignora a chave `timezone`: cron é sempre
    # UTC — 08:30 no verão de Lisboa / 07:30 no inverno; se a hora local exacta
    # interessar, usar dois crons ou aceitar o drift de 1h).
    - cron: '30 7 * * *'
  workflow_dispatch:
  repository_dispatch:
    # Keep-alive externo (docs/EXTERNAL-KEEPALIVE.md): o POST ping acorda todos
    # os workflows que declaram este tipo. A entrega medida do schedule do
    # GitHub é ~44 % do nominal — com o ping, os alertas «immediate» são
    # avaliados ~30 min (em vez de ~5 h reais) e o digest sai no primeiro tick
    # após as 07:00 em vez de depender do cron das 07:30. É seguro: o dedup
    # `last_sent_at` impõe um mínimo de 3 h entre envios por subscrição
    # (COOLDOWN_MS — condições persistentes podem notificar até ~8×/dia, mais
    # do que as ~4-5 corridas anteriores, por desenho da janela de 3 h) e
    # `alreadySentDigestToday` garante um digest/dia. A leitura de /start NÃO
    # corre aqui — pertence ao telegram-poll.yml (ver evaluate-alerts.js).
    types: [ping]


permissions:
  contents: read

# Um digest em curso não deve ser cancelado nem sobreposto por uma execução
# imediata seguinte (envio duplicado de emails/Telegram); a fila resolve-a.
concurrency:
  group: evaluate-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Evaluate alert subscriptions
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npm run alerts:evaluate
