name: Alerts & Telegram Poll

# Um só workflow para os dois passos: o poll de /start corre SEMPRE antes da
# avaliação, no mesmo job. Quando eram dois workflows acordados pelo mesmo
# ping, os dois liam o offset partilhado do Supabase — o primeiro respondia
# «Ligado ✅» e o segundo «Link inválido» à mesma mensagem; e a avaliação
# podia correr antes da ligação concluir (o resumo desse dia ia só por email
# e o dedup diário impedia a recuperação no Telegram).
on:
  schedule:
    # A cada 30 min cobre os três deveres: confirmação de /start, avaliação
    # de alertas «immediate» (o COOLDOWN_MS de 3 h por subscrição limita os
    # envios — condições persistentes notificam até ~8×/dia, por desenho da
    # janela) e o resumo diário no primeiro tick ≥ 07:00 UTC
    # (alreadySentDigestToday garante um envio/dia). Cron é sempre UTC — o
    # GitHub ignora a chave `timezone`.
    - cron: '*/30 * * * *'
  workflow_dispatch:
  repository_dispatch:
    # Keep-alive externo (docs/EXTERNAL-KEEPALIVE.md): o POST ping acorda
    # todos os workflows que declaram este tipo. A entrega medida do schedule
    # do GitHub é ~2 % do nominal — o ping é a cadência real e o schedule é
    # a redundância. É seguro: o offset do poll só é gravado no fim do passo
    # (um cancel reprocessa de forma idempotente), o dedup `last_sent_at`
    # impõe o mínimo de 3 h entre alertas e `alreadySentDigestToday` garante
    # um digest/dia; os runs extra só encurtam a latência.
    types: [ping]

permissions:
  contents: read

# Um envio em curso não deve ser cancelado nem sobreposto pelo tick seguinte
# (emails/Telegram duplicados); a fila resolve-o. E nunca há dois leitores do
# offset do poll — a concorrência vive dentro deste grupo.
concurrency:
  group: evaluate-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Check Telegram poll prerequisites
        id: poll
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "Telegram/Supabase secrets missing — /start poll is a no-op."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Poll Telegram /start links
        # Sempre antes da avaliação: um /start que chegue neste tick liga a
        # conta ANTES do avaliador escolher os canais — o resumo/imediato já
        # vai para o Telegram nessa mesma execução.
        if: steps.poll.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npm run telegram:poll

      - name: Evaluate alert subscriptions
        # Corre mesmo quando o poll é saltado ou falha: os alertas por email
        # nunca dependem do bot Telegram.
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npm run alerts:evaluate
