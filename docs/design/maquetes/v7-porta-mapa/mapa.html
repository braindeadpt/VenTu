<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030E18">
<title>Mapa da costa · VenTu</title>
<link rel="stylesheet" href="lib/fonts.css">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="lib/MarkerCluster.css">
<style>
/* VenTu v6 «Atlântico»: base escura, fotografia, tipografia condensada forte. Partilhado pela home e pelo spot. */
:root{
  --abismo:#030E18;--fundo:#071B2C;--mar:#0C2A42;--linha:#1E4361;--espuma:#F3F8FB;--nevoa:#A9C2D4;--sol:#FFC93C;--gelo:#7FE7FF;--ink:#04131F;
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;--txt:'Barlow',system-ui,sans-serif;
  --band:#40DCD0;--band-t:#04131F;
  --r:14px;--sombra:0 18px 40px -18px rgba(0,0,0,.65);
  color-scheme:dark;
}
:root.sol{--abismo:#EEF4F8;--fundo:#FFFFFF;--mar:#E2ECF3;--linha:#C3D4E0;--espuma:#04131F;--nevoa:#38526A;--sol:#9A6A00;--gelo:#005F8A;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--abismo);color:var(--espuma);font:500 17px/1.45 var(--txt);font-variant-numeric:lining-nums;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--sol);outline-offset:3px;border-radius:6px}

/* ---------- barra de topo ---------- */
.top{position:absolute;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:linear-gradient(180deg,rgba(3,14,24,.78),rgba(3,14,24,0))}
.marca{font:900 italic 30px/1 var(--disp);letter-spacing:-.02em;text-decoration:none;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.marca svg{width:26px;height:26px}
.marca b{color:var(--sol);font-weight:900}
.voltar{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px 0 6px;border-radius:999px;background:rgba(3,14,24,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-decoration:none;font:700 16px/1 var(--txt)}
.top .esp{flex:1}

/* ---------- selector kite / surf ---------- */
.modo{display:inline-grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:rgba(3,14,24,.62);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1.5px rgba(243,248,251,.22);position:relative}
.modo button{position:relative;z-index:1;border:0;background:none;min-height:44px;min-width:76px;padding:0 16px;border-radius:999px;cursor:pointer;
  font:800 italic 21px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--espuma)}
.modo button svg{width:20px;height:20px;flex:none}
.modo button[aria-pressed=true]{color:var(--ink)}
.modo .pista{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--sol);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.modo[data-d=surf] .pista{transform:translateX(100%)}
@media (prefers-reduced-motion:reduce){.modo .pista{transition:none}}

/* ---------- chips de banda ---------- */
.chip{display:inline-flex;align-items:center;gap:.3em;padding:.08em .42em .1em;border-radius:6px;background:var(--c,var(--band));color:var(--t,var(--band-t));
  font-weight:800;font-style:normal;white-space:nowrap}
.nota{display:inline-flex;align-items:baseline;justify-content:center;background:var(--c);color:var(--t);border-radius:12px;font:900 var(--fs,44px)/1 var(--disp);
  font-variant-numeric:tabular-nums;padding:.1em .16em .06em;min-width:1.25em}
.nota small{font-size:.38em;font-weight:800;opacity:.85;margin-left:.06em}

/* ---------- foto ---------- */
.foto{position:absolute;inset:0;overflow:hidden;background:var(--mar)}
.foto img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:60% 40%}
.vivo .foto.kb img{animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-1.5%,1%)}}
@media (prefers-reduced-motion:reduce){.vivo .foto.kb img{animation:none}}
.credito-foto{position:absolute;z-index:3;right:8px;bottom:6px;font:500 10.5px/1.2 var(--txt);color:rgba(243,248,251,.86);text-shadow:0 1px 2px #000;max-width:70%;text-align:right}
.credito-foto a{text-decoration:none}

/* ---------- ondulação animada (linha de espuma) ---------- */
.swell{position:absolute;left:0;right:0;bottom:-1px;height:26px;z-index:2;color:var(--abismo);pointer-events:none;overflow:hidden}
.swell svg{position:absolute;bottom:0;left:0;width:200%;height:26px}
.vivo .swell svg{animation:swell 9s linear infinite}
.vivo .swell svg.b{animation-duration:14s;opacity:.5}
@keyframes swell{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.vivo .swell svg{animation:none}}

/* ---------- títulos de secção ---------- */
.sec{font:900 italic clamp(26px,6.6vw,40px)/.95 var(--disp);text-transform:uppercase;letter-spacing:-.01em;margin:0 0 14px}
.sec span{color:var(--nevoa);font-style:normal;font-weight:700;font-size:.62em;letter-spacing:.02em;margin-left:.2em}

/* ---------- legenda ---------- */
.leg{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:center;font:700 13px/1 var(--txt)}
.leg .chip{font-size:13px;padding:5px 8px;border-radius:7px}
.leg .txt{flex-basis:100%;color:var(--nevoa);font-weight:500;font-size:14px;line-height:1.4;margin-top:6px}

/* ---------- vento (canvas sobre o mapa) ---------- */
canvas.vento{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* ---------- rodapé ---------- */
.rodape{padding:28px 16px 120px;color:var(--nevoa);font-size:14px;border-top:1px solid var(--linha)}
.rodape a{color:var(--espuma)}
.rodape p{margin:0 0 8px;max-width:70ch}

/* ---------- entrada (transições) ---------- */
.entra{animation:entra .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.entra{animation:none}}

/* ---------- mapa: atribuição ---------- */
.maplibregl-ctrl-attrib{display:none}
.credito-mapa{position:absolute;z-index:4;left:8px;bottom:6px;font:500 10.5px/1.2 var(--txt);color:rgba(243,248,251,.75)}
.credito-mapa a{color:inherit}
/* capturas (?shot=1): Ken Burns congelado num fotograma; o Chromium headless deste sandbox cai com a animação + WebGL a 1440 px */
.captura.vivo .foto.kb img{animation:none;transform:scale(1.06)}

/* variante «sol»: o corpo fica claro; o que está sobre foto, mapa ou barra fixa mantém a base escura */
:root.sol .hero,:root.sol .card,:root.sol .cena,:root.sol .top,:root.sol .regua,:root.sol .lider{--abismo:#030E18;--fundo:#071B2C;--mar:#0C2A42;--linha:#1E4361;--espuma:#F3F8FB;--nevoa:#A9C2D4;--sol:#FFC93C;--gelo:#7FE7FF;--ink:#04131F;color:var(--espuma)}
:root.sol body{background:var(--abismo)}
:root.sol .fator,:root.sol .estudo{box-shadow:0 1px 0 var(--linha),0 8px 24px -16px rgba(4,19,31,.4)}
:root.sol .efeito{background:var(--linha)}


.site{position:sticky;top:0;z-index:40;height:64px;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;background:rgba(3,14,24,.92);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--linha)}
.site .marca{font:900 italic 28px/1 var(--disp);letter-spacing:-.02em;text-decoration:none;text-transform:uppercase;display:flex;align-items:center;gap:7px;margin-right:10px}
.site .marca svg{width:30px;height:30px}
.site .marca b{color:var(--sol);font-weight:900}
.site .esp{flex:1}
.nav-d,.acc-d{display:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;border-radius:12px;background:none;color:var(--espuma);cursor:pointer;position:relative;text-decoration:none}
.ib svg{width:24px;height:24px}
.ib.mapa-ic{color:var(--espuma)}
.ib.mapa-ic::after{content:'';position:absolute;right:7px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--gelo);box-shadow:0 0 0 2px var(--abismo)}
.nv{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 10px;border:0;border-radius:10px;background:none;color:var(--nevoa);font:600 15px/1 var(--txt);text-decoration:none;cursor:pointer;white-space:nowrap}
.nv svg{width:16px;height:16px}
.nv:hover{color:var(--espuma);background:rgba(243,248,251,.06)}
.nv.mapa{color:var(--espuma);font-weight:700;box-shadow:inset 0 0 0 1.5px rgba(127,231,255,.38);padding:0 13px 0 10px;margin-right:6px}
.nv.mapa svg{width:19px;height:19px;color:var(--gelo)}
.nv.mapa .vivo-pt{width:7px;height:7px;border-radius:50%;background:var(--gelo);margin-left:2px;box-shadow:0 0 0 3px rgba(127,231,255,.18)}
.nv[aria-current=page]{background:rgba(127,231,255,.12)}
.acc-d .nv{color:var(--espuma);font-weight:500;font-size:14px}
.acc-d .nv svg{width:18px;height:18px}
.acc-d .ib{width:40px;height:40px}
.acc-d .ib svg{width:20px;height:20px}
@media (min-width:1024px){
  .site{padding:0 24px 0 32px;gap:4px}
  .nav-d,.acc-d{display:flex;align-items:center;gap:2px}
  .acc-m{display:none}
}
/* gaveta (telemóvel) */
.gaveta{position:fixed;inset:64px 0 0 0;z-index:39;background:rgba(3,14,24,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 16px 24px;overflow:auto;display:none}
.menu-aberto .gaveta{display:block}
.gaveta a,.gaveta .lin{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border-radius:12px;text-decoration:none;font:600 17px/1.2 var(--txt);color:var(--espuma)}
.gaveta .lin{justify-content:space-between}
.gaveta svg{width:22px;height:22px;flex:none}
.gaveta .g-mapa{background:rgba(127,231,255,.1);box-shadow:inset 0 0 0 1.5px rgba(127,231,255,.32);margin-bottom:8px}
.gaveta .g-mapa svg:first-child{color:var(--gelo)}
.gaveta .g-mapa small{display:block;font:500 13px/1.2 var(--txt);color:var(--nevoa);margin-top:2px}
.gaveta .g-mapa .seta-g{margin-left:auto;color:var(--sol)}
.gaveta hr{border:0;border-top:1px solid var(--linha);margin:10px 0}
.gaveta .g-t{font:800 12px/1 var(--txt);letter-spacing:.14em;text-transform:uppercase;color:var(--nevoa);margin:14px 12px 6px}
.gaveta .sel{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 12px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--linha);font:600 16px/1 var(--txt)}
.gaveta .sel span{display:flex;align-items:center;gap:10px}

/* ===== /mapa com a pele v6 «Atlântico» (Leaflet fica; só muda o visual) ===== */
html,body{height:100%}
[hidden]{display:none!important}
.site.compacto .mapa-ic{display:none!important}
body{overflow:hidden;font-size:16px}
.site.compacto{position:fixed;left:0;right:0;top:0;height:48px;padding:0 6px 0 14px}
.site.compacto .marca{font-size:24px;margin-right:0}
.site.compacto .marca svg{width:26px;height:26px}
.site.compacto .onde{display:flex;align-items:center;gap:10px;font:800 italic 19px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em;color:var(--nevoa);white-space:nowrap}
.site.compacto .onde::before{content:'';width:1.5px;height:22px;background:var(--linha);margin:0 2px 0 10px}
.site.compacto .acc-m{display:flex}
.site.compacto .nav-d,.site.compacto .acc-d{display:none}
.site.compacto .ib{width:44px;height:44px}
.site.compacto .ib svg{width:22px;height:22px}
#mapa{position:fixed;left:0;right:0;top:48px;bottom:0;background:#0A2236}
.leaflet-container{font:inherit;background:#0A2236}
.leaflet-layer.base{filter:url(#v6base)}
.leaflet-layer.rotulos-base{opacity:.62}
.leaflet-control-container{display:none}
canvas.vento{position:absolute;inset:0;z-index:450;pointer-events:none}

/* ---------- vidro v6 (painéis sobre o mapa) ---------- */
.vidro{background:rgba(3,14,24,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1.5px rgba(243,248,251,.12),0 18px 40px -18px rgba(0,0,0,.75);border-radius:16px}
.t-sec{font:900 italic 30px/.95 var(--disp);text-transform:uppercase;letter-spacing:-.005em;margin:0}
.t-mini{font:800 12px/1 var(--txt);letter-spacing:.14em;text-transform:uppercase;color:var(--nevoa);margin:0}

/* ---------- marcadores: nota em fill da banda (v6), nome em pílula a partir de z9 ---------- */
.mk{background:none;border:0}
.mk .p{position:absolute;left:0;top:0;transform:translate(-16px,-50%);display:flex;align-items:center;white-space:nowrap;border-radius:999px;
  background:rgba(3,14,24,.88);box-shadow:inset 0 0 0 1.5px rgba(243,248,251,.2),0 4px 10px -4px rgba(0,0,0,.8);padding:2px;font:800 14px/1 var(--txt);color:var(--espuma)}
.mk .n{min-width:28px;height:26px;border-radius:999px;background:var(--c);color:var(--t);display:flex;align-items:center;justify-content:center;font:900 19px/1 var(--disp);padding:0 6px;font-variant-numeric:tabular-nums}
.mk .nm{padding:0 9px 0 7px;display:none}
.com-nomes .mk .nm{display:block}
.mk.sel .p{box-shadow:0 0 0 3px var(--abismo),0 0 0 6px var(--sol),0 8px 20px -6px rgba(0,0,0,.8)}
.mk svg.arco{position:absolute;left:0;top:0;width:58px;height:58px;transform:translate(-50%,-50%);overflow:visible;pointer-events:none}
.cl{background:none;border:0}
.cl .p{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--t);display:flex;align-items:center;justify-content:center;
  font:900 22px/1 var(--disp);box-shadow:0 0 0 3px rgba(3,14,24,.92),0 0 0 4.5px rgba(243,248,251,.28),0 8px 18px -6px rgba(0,0,0,.85);font-variant-numeric:tabular-nums}
.cl .q{position:absolute;right:-12px;top:-9px;min-width:26px;height:21px;padding:0 6px;border-radius:999px;background:var(--espuma);color:var(--ink);font:800 12.5px/21px var(--txt);text-align:center;box-shadow:0 0 0 2px var(--abismo)}
.cl.s .p{width:38px;height:38px;font-size:20px}
.cl.l .p{width:50px;height:50px;font-size:24px}

/* ---------- painel Explorar (desktop) ---------- */
.explorar{position:fixed;z-index:500;left:12px;top:60px;bottom:12px;width:372px;display:flex;flex-direction:column;overflow:hidden}
.ex-cab{display:flex;align-items:center;gap:10px;padding:14px 10px 10px 16px}
.ex-cab .t-sec{flex:1}
.ex-cab .cont{font:600 14px/1.2 var(--txt);color:var(--nevoa);text-align:right}
.ex-cab .cont b{color:var(--espuma);font:900 20px/1 var(--disp)}
.recolher{width:40px;height:40px;border:0;border-radius:10px;background:rgba(243,248,251,.06);color:var(--espuma);display:flex;align-items:center;justify-content:center}
.recolher svg{width:20px;height:20px;transform:rotate(90deg)}
.ex-corpo{padding:0 14px;display:flex;flex-direction:column;gap:12px}
.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pill{display:flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 8px;border:0;border-radius:999px;background:rgba(243,248,251,.06);box-shadow:inset 0 0 0 1.5px rgba(243,248,251,.12);
  font:800 italic 16px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em;color:var(--espuma);white-space:nowrap}
.pill svg{width:16px;height:16px;flex:none}
.pill[aria-pressed=true]{background:var(--sol);color:var(--ink);box-shadow:none}
.sels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sel{display:flex;flex-direction:column;gap:5px}
.sel .caixa{display:flex;align-items:center;justify-content:space-between;min-height:40px;padding:0 10px 0 12px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--linha);background:rgba(7,27,44,.7);font:600 15px/1 var(--txt)}
.sel .caixa svg{width:16px;height:16px;color:var(--nevoa)}
.togs{display:flex;gap:16px}
.tog{display:flex;align-items:center;gap:9px;font:600 15px/1 var(--txt);min-height:36px}
.sw{position:relative;width:40px;height:24px;border-radius:999px;background:rgba(243,248,251,.14);box-shadow:inset 0 0 0 1.5px rgba(243,248,251,.16);flex:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--nevoa);transition:transform .2s}
.sw.on{background:var(--sol);box-shadow:none}
.sw.on::after{transform:translateX(16px);background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 6px 0 11px;border-radius:999px;background:rgba(255,201,60,.14);box-shadow:inset 0 0 0 1.5px rgba(255,201,60,.5);font:700 14px/1 var(--txt);color:var(--espuma)}
.fchip svg{width:14px;height:14px}
.fchip .x{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(243,248,251,.1)}
.vista{display:flex;align-items:center;gap:8px;justify-content:space-between;border-top:1px solid var(--linha);padding-top:12px}
.vista .t-mini b{color:var(--espuma)}
.areas{display:flex;gap:4px}
.area{min-height:30px;padding:0 9px;border-radius:999px;border:0;background:none;box-shadow:inset 0 0 0 1.5px var(--linha);font:700 13px/1 var(--txt);color:var(--nevoa)}
.area[aria-pressed=true]{background:var(--espuma);color:var(--ink);box-shadow:none}
.ordem{font:600 13px/1.2 var(--txt);color:var(--nevoa);margin:-4px 0 0}
.lista{flex:1;overflow:hidden;margin-top:8px;padding:0 8px 8px;position:relative}
.lista::after{content:'';position:absolute;left:0;right:0;bottom:0;height:34px;background:linear-gradient(180deg,rgba(3,14,24,0),rgba(3,14,24,.95));pointer-events:none}
.lst{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:8px 8px;border-radius:12px;text-decoration:none}
.lst+.lst{box-shadow:0 -1px 0 rgba(30,67,97,.7)}
.lst.sel{background:rgba(255,240,122,.09);box-shadow:inset 0 0 0 1.5px rgba(255,240,122,.45)}
.lst .nota{--fs:30px;border-radius:9px;min-width:44px}
.lst-n{display:block;font:900 italic 20px/.95 var(--disp);text-transform:uppercase}
.lst-r{display:block;font:600 13px/1.2 var(--txt);color:var(--nevoa);margin-top:3px}
.lst-n span{font:600 13.5px/1 var(--txt);font-style:normal;text-transform:none;color:var(--nevoa);margin-left:6px}
.lst-m{display:block;font:500 13.5px/1.3 var(--txt);color:var(--nevoa);margin-top:2px;white-space:nowrap}
.lst-m b{color:var(--espuma);font-weight:700}
.rel{font-weight:700}
.rel.off{color:var(--gelo)}.rel.on{color:#FF9D94}.rel.cross{color:var(--nevoa)}
.lst .seta{width:20px;height:20px;color:var(--nevoa)}

/* ---------- topo: Vento | Ondulação | Nenhum + hora ---------- */
.topo-m{position:fixed;z-index:520;top:60px;left:calc(396px + (100vw - 396px - 68px) / 2);transform:translateX(-50%);display:flex;align-items:center;gap:10px}
.seg{display:inline-grid;grid-template-columns:repeat(3,auto);padding:4px;border-radius:999px;position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;min-height:40px;padding:0 16px;border-radius:999px;font:800 italic 18px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em;color:var(--espuma);display:flex;align-items:center;gap:7px;white-space:nowrap}
.seg button svg{width:18px;height:18px}
.seg button[aria-checked=true]{background:var(--sol);color:var(--ink)}
.hora-p{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 14px 0 16px;border:0;border-radius:999px;font:800 15px/1 var(--txt);color:var(--espuma);white-space:nowrap}
.hora-p b{color:var(--sol);font:900 italic 20px/1 var(--disp)}
.hora-p svg{width:16px;height:16px;color:var(--nevoa);transform:rotate(180deg)}

/* ---------- pilha de controlos (direita) ---------- */
.pilha{position:fixed;z-index:520;right:12px;top:60px;display:flex;flex-direction:column;gap:8px}
.grupo{display:flex;flex-direction:column;overflow:hidden;border-radius:14px}
.grupo .cb+.cb{box-shadow:0 -1px 0 var(--linha)}
.cb{width:46px;height:46px;border:0;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--espuma);background:none;position:relative}
.grupo .cb{border-radius:0}
.cb svg{width:21px;height:21px}
.cb[aria-pressed=true]{background:var(--espuma);color:var(--ink)}
.cb.ab{box-shadow:0 0 0 2px var(--sol)}

/* ---------- legenda ---------- */
.legenda{position:fixed;z-index:510;right:12px;bottom:12px;width:254px;padding:12px 14px 10px}
.legenda .t-mini{margin-bottom:8px}
.bandas{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.bandas span{display:flex;flex-direction:column;align-items:center;justify-content:center;height:40px;border-radius:7px;background:var(--c);color:var(--t);font:900 17px/1 var(--disp)}
.bandas span small{font:700 9.5px/1 var(--txt);letter-spacing:.02em;margin-top:2px;white-space:nowrap}
.rampa{height:10px;border-radius:999px;background:linear-gradient(90deg,rgba(127,231,255,.35),#7FE7FF 30%,#F3F8FB 70%,#FFFFFF);margin:4px 0 4px}
.rampa-l{display:flex;justify-content:space-between;font:700 12px/1 var(--txt);color:var(--nevoa)}
.legenda .nota-v{font:500 12.5px/1.35 var(--txt);color:var(--nevoa);margin:7px 0 0}
.legenda .nota-v b{color:var(--espuma)}
.legenda hr{border:0;border-top:1px solid var(--linha);margin:10px 0}
.ajuda{display:inline-flex;align-items:center;gap:7px;min-height:32px;font:700 13.5px/1 var(--txt);color:var(--gelo);text-decoration:none;margin-top:4px}
.ajuda svg{width:18px;height:18px}
.atrib{position:fixed;z-index:505;right:280px;bottom:4px;font:500 10.5px/1.2 var(--txt);color:rgba(243,248,251,.62)}
.atrib a{color:inherit}

/* ---------- régua de 48 h (timeline, linguagem da régua da v6) ---------- */
.regua48{position:fixed;z-index:510;left:396px;right:278px;bottom:12px;padding:12px 14px 10px}
.r-cab{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.r-cab .t-mini{flex:1;white-space:nowrap}
.r-cab .t-mini b{color:var(--espuma)}
.r-chips{display:flex;gap:6px}
.r-chip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;background:rgba(243,248,251,.07);font:700 13px/1 var(--txt);white-space:nowrap}
.r-chip svg{width:16px;height:16px;color:var(--gelo)}
.r-corpo{display:flex;align-items:flex-end;gap:10px}
.r-bts{display:flex;flex-direction:column;gap:6px}
.r-bt{width:44px;height:44px;border:0;border-radius:50%;background:var(--sol);color:var(--ink);display:flex;align-items:center;justify-content:center}
.r-bt svg{width:20px;height:20px}
.r-bt.sec{background:rgba(243,248,251,.08);color:var(--espuma);border-radius:12px;height:30px;font:800 12px/1 var(--txt);width:auto;padding:0 8px;letter-spacing:.06em;text-transform:uppercase}
.r-dias{flex:1;display:flex;gap:10px;min-width:0}
.r-dia{flex:var(--n) 1 0;min-width:0}
.r-dn{display:block;font:800 12px/1 var(--txt);letter-spacing:.14em;text-transform:uppercase;color:var(--nevoa);margin:0 0 13px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-cels{display:flex;gap:4px}
.r-c{flex:1 1 0;min-width:0;border:0;padding:0;background:none;text-align:center;position:relative}
.r-c .bar{display:flex;align-items:center;justify-content:center;height:44px;border-radius:9px;background:var(--c);color:var(--t);font:900 24px/1 var(--disp);font-variant-numeric:tabular-nums}
.r-c .hl{display:block;font:700 12.5px/1 var(--txt);color:var(--nevoa);margin-top:6px;white-space:nowrap}
.r-c[aria-pressed=true] .bar{box-shadow:0 0 0 3px var(--abismo),0 0 0 6px var(--espuma)}
.r-c[aria-pressed=true] .hl{color:var(--espuma);font-weight:800}
.r-c[aria-pressed=true]::before{content:'';position:absolute;left:50%;top:-9px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--espuma);border-bottom:0}

/* ---------- cartão do spot (desktop) ---------- */
.spot{position:fixed;z-index:530;width:356px;padding:16px 16px 14px}
.spot .fecha{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;border-radius:10px;background:rgba(243,248,251,.07);color:var(--espuma);display:flex;align-items:center;justify-content:center}
.spot .fecha svg{width:18px;height:18px}
.sp-cab{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding-right:36px}
.sp-cab .nota{--fs:58px}
.pn-n{display:block;font:900 italic 32px/.92 var(--disp);text-transform:uppercase}
.pn-s{display:block;font:600 14px/1.2 var(--txt);color:var(--nevoa);margin-top:5px}
.pn-f{margin:12px 0 0;font:800 17px/1.3 var(--txt)}
.pn-f2{margin:3px 0 0;font:500 15px/1.35 var(--txt);color:var(--nevoa)}
.pn-f2 b{color:var(--espuma);font-weight:700}
.metr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 0}
.metr div{padding:8px 10px;border-radius:10px;background:rgba(243,248,251,.06)}
.metr span{display:block;font:800 11px/1 var(--txt);letter-spacing:.12em;text-transform:uppercase;color:var(--nevoa)}
.metr b{display:block;font:900 24px/1 var(--disp);margin-top:5px;white-space:nowrap}
.metr b small{font:700 13px/1 var(--txt);color:var(--nevoa);margin-left:3px}
.mini48{margin:12px 0 0}
.mini48 .t-mini{display:flex;justify-content:space-between;margin-bottom:6px}
.m48{position:relative;display:flex;align-items:flex-end;gap:1.5px;height:46px}
.m48 i{flex:1 1 0;border-radius:2px 2px 0 0;background:var(--c);min-height:3px}
.m48 i.agora{box-shadow:0 0 0 1.5px var(--espuma)}
.m48 .lim{position:absolute;left:0;right:0;border-top:1.5px dashed rgba(243,248,251,.55)}
.m48-l{display:flex;justify-content:space-between;font:700 11.5px/1 var(--txt);color:var(--nevoa);margin-top:5px}
.sp-acc{display:flex;gap:8px;margin-top:14px}
.b-sol{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:999px;background:var(--sol);color:var(--ink);font:900 italic 20px/1 var(--disp);text-transform:uppercase;text-decoration:none;letter-spacing:.02em}
.b-sol svg,.b-sec svg{width:20px;height:20px}
.b-sec{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px rgba(243,248,251,.3);font:700 15px/1 var(--txt);text-decoration:none}
.sp-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.spot::before{content:'';position:absolute;left:-9px;top:var(--ay,60px);width:18px;height:18px;background:rgba(3,14,24,.95);transform:rotate(45deg);box-shadow:-1.5px 1.5px 0 rgba(243,248,251,.12)}

/* ---------- menu Camadas (desktop: popover à esquerda da pilha) ---------- */
.camadas{position:fixed;z-index:540;right:68px;top:60px;width:350px;max-height:calc(100vh - 72px);overflow:hidden;padding:14px 0 10px;display:flex;flex-direction:column}
.cm-cab{display:flex;align-items:center;justify-content:space-between;padding:0 10px 8px 16px}
.cm-cab .t-sec{font-size:26px}
.cm-corpo{overflow:hidden;padding:0 8px}
.cm-g{margin:10px 8px 4px}
.cm-l{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:12px}
.cm-l.on{background:rgba(255,201,60,.08)}
.cm-ic{width:34px;height:34px;border-radius:10px;background:rgba(243,248,251,.07);display:flex;align-items:center;justify-content:center;color:var(--nevoa)}
.cm-ic svg{width:19px;height:19px}
.cm-l.on .cm-ic{background:var(--sol);color:var(--ink)}
.cam-n{display:block;font:700 15px/1.2 var(--txt)}
.cam-d{display:block;font:500 12.5px/1.3 var(--txt);color:var(--nevoa);margin-top:2px}
.cm-l .dir{display:flex;align-items:center;gap:6px}
.rep{width:30px;height:30px;border:0;border-radius:8px;background:rgba(243,248,251,.08);color:var(--espuma);display:flex;align-items:center;justify-content:center}
.rep svg{width:15px;height:15px}
.cm-mini{grid-column:2/4;display:flex;gap:2px;margin-top:4px}
.cm-mini i{flex:1;height:8px;border-radius:2px;background:var(--c)}
.cm-base{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 8px}
.bm{display:flex;align-items:center;gap:9px;padding:6px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--linha);font:700 14px/1.15 var(--txt)}
.bm small{display:block;font:500 11.5px/1.2 var(--txt);color:var(--nevoa)}
.bm .th{width:40px;height:40px;border-radius:8px;flex:none;background:linear-gradient(135deg,#0C3454 50%,#15263A 50%)}
.bm.sat .th{background:radial-gradient(circle at 70% 30%,#4f6b3a,#253a2a 45%,#0c2a42 46%)}
.bm[aria-checked=true]{box-shadow:inset 0 0 0 2px var(--sol)}
.cm-sep{border:0;border-top:1px solid var(--linha);margin:8px 16px}

/* ================= telemóvel (< 1024 px) ================= */
@media (max-width:1023px){
  .site.compacto .onde{font-size:17px}
  .site.compacto .onde::before{margin-left:8px}
  .site.compacto .acc-m .mapa-ic{display:none}
  .explorar,.legenda,.camadas.desk,.spot.desk{display:none}
  .topo-m{left:12px;transform:none;top:58px;flex-direction:column;align-items:flex-start;gap:8px}
  .seg button{min-height:40px;padding:0 12px;font-size:17px}
  .hora-p{min-height:44px}
  .pilha{top:58px;right:10px}
  .grupo.zoom{display:none}
  .cb{width:44px;height:44px}
  .atrib{right:auto;left:12px;bottom:auto;top:var(--atop,560px)}
  .regua48{left:8px;right:8px;bottom:calc(var(--folha,150px) + 8px);padding:10px 10px 9px}
  .r-cab{margin-bottom:8px}
  .r-chips{display:none}
  .r-corpo{gap:8px}
  .r-bts{flex-direction:column}
  .r-bt{width:40px;height:40px}
  .r-bt.sec{display:none}
  .r-dias{gap:6px}
  .r-cels{gap:2px}
  .r-c .bar{height:36px;border-radius:6px;font-size:15px;letter-spacing:-.04em}
  .r-c[aria-pressed=true]::before{display:none}
  .r-c .hl{display:none}
  .r-c.mostra .hl{display:block;position:absolute;left:50%;transform:translateX(-50%);font-size:12px}
  .r-dn{font-size:11.5px;letter-spacing:.1em;margin-bottom:7px}
  .r-c[aria-pressed=true] .bar{box-shadow:0 0 0 2px var(--abismo),0 0 0 4px var(--espuma)}
  .folha{position:fixed;z-index:560;left:0;right:0;bottom:0;border-radius:20px 20px 0 0;padding:6px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(3,14,24,.95);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 -1px 0 var(--linha),0 -18px 40px -18px rgba(0,0,0,.8)}
  .pega{width:44px;height:5px;border-radius:999px;background:rgba(243,248,251,.3);margin:4px auto 10px}
  .melhor{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-decoration:none;padding:2px 2px 10px}
  .melhor .nota{--fs:34px;border-radius:9px}
  .f-bts{display:flex;gap:6px}
  .f-bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 10px;border:0;border-radius:12px;background:rgba(243,248,251,.07);box-shadow:inset 0 0 0 1.5px rgba(243,248,251,.12);font:700 14px/1 var(--txt);color:var(--espuma);white-space:nowrap}
  .f-bt svg{width:18px;height:18px}
  .f-bt.on{box-shadow:inset 0 0 0 1.5px rgba(255,201,60,.6);background:rgba(255,201,60,.12)}
  .f-bt .q{min-width:20px;height:20px;border-radius:999px;background:var(--sol);color:var(--ink);font:800 12px/20px var(--txt);text-align:center}
  .f-bt.ic{width:44px;padding:0;margin-left:auto}
  .folha .spot,.folha .camadas{position:static;width:auto;padding:0;background:none;box-shadow:none;backdrop-filter:none;max-height:none}
  .folha .spot::before{display:none}
  .folha .spot .fecha{right:12px;top:16px}
  .folha .camadas .cm-cab{padding:0 0 6px 2px}
  .folha .camadas .cm-corpo{padding:0;max-height:600px;position:relative}
  .folha .camadas .cm-corpo::after{content:'';position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(180deg,rgba(3,14,24,0),rgba(3,14,24,.96))}
  .voltar-l{display:inline-flex;align-items:center;gap:4px;min-height:36px;font:700 14px/1 var(--txt);color:var(--nevoa);text-decoration:none;margin:-4px 0 6px}
  .voltar-l svg{width:16px;height:16px;transform:rotate(180deg)}
}
@media (min-width:1024px){ .folha{display:none} }
.mk.sel .nm{display:none!important}
.cm-ab .topo-m{left:calc(396px + (100vw - 396px - 430px) / 2)}
.nu .explorar,.nu .topo-m,.nu .pilha,.nu .regua48,.nu .legenda,.nu .folha,.nu .atrib{display:none!important}

</style>

<script>(() => {
'use strict';
const D = JSON.parse(document.getElementById('dados').textContent);

/* ---------- bandas v6 (os limiares do núcleo; cores de cores.md) ---------- */

/* ---------- estado (vem do link da home: ?sport=&t=&dia=&wind=&lat=&lon=&z=) ---------- */

  ['big-wave', 'Big Wave', IC.MONTE], ['foil', 'Foil', IC.RAIO], ['sup', 'SUP', IC.ONDA], ['wakeboard', 'Wakeboard', IC.RAIO]];
const sport = MODS.some(m => m[0] === qs.get('sport')) ? qs.get('sport') : 'kitesurf';
const nomeMod = MODS.find(m => m[0] === sport)[1];
const t = qs.has('t') ? clamp(+qs.get('t'), 0, 23) : 14;
const I = (qs.get('dia') === '1' ? 24 : 0) + t;              // índice da hora (0 = qua 14 out, 00h)

const ARCOS = true;                                          // «Vento» na pilha (arcos nos pins) ligado
const lat = +(qs.get('lat') || 39.35), lon = +(qs.get('lon') || -8.95), z = +(qs.get('z') || 7);

const RUMOS = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
const rumo = d => RUMOS[Math.round(((d % 360) + 360) % 360 / 22.5) % 16];
const ang = (a, b) => Math.abs(((a - b) % 360 + 540) % 360 - 180);
const rel = (wd, ori) => ang(wd, ori) < 60 ? 'on' : ang(wd, ori + 180) < 60 ? 'off' : 'cross';
const REL = { on: 'onshore', off: 'offshore', cross: 'cross' };

const noite = i => (D.campo.find(c => c.id === 'guincho').sunEl[i] ?? 0) < -0.8;

/* ---------- mapa (Leaflet, como hoje) ---------- */
const map = L.map('mapa', { zoomControl: false, attributionControl: false, zoomSnap: .25, fadeAnimation: false, zoomAnimation: !qs.has('shot') });
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_';

const ref = L.tileLayer(ESRI + 'Reference/MapServer/tile/{z}/{y}/{x}', { className: 'rotulos-base', maxZoom: 16 }).addTo(map);
const foco = estado === 'spot' ? SP.find(s => s.id === (qs.get('spot') || 'guincho')) : null;

/* ---------- marcadores e clusters na paleta v6 ---------- */
function arco(s) {

  const r = rel(wd, s.ori), cor = r === 'off' ? '#7FE7FF' : r === 'on' ? '#FF8A80' : '#A9C2D4';
  const L2 = w < 8 ? 34 : w < 18 ? 60 : 90, to = (wd + 180) * Math.PI / 180, R = 21;

  return `<svg class="arco" viewBox="0 0 58 58"><path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="#030E18" stroke-width="6.5" stroke-linecap="round"/><path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" fill="none" stroke="${cor}" stroke-width="3.6" stroke-linecap="round"/><circle cx="${xh.toFixed(1)}" cy="${yh.toFixed(1)}" r="3.4" fill="${cor}" stroke="#030E18" stroke-width="1.6"/></svg>`;
}

  iconCreateFunction: c => { const ms = c.getAllChildMarkers(), best = Math.max(...ms.map(m => m.options.n ?? -1)), b = banda(best < 0 ? null : best), q = ms.length;
    return L.divIcon({ className: 'cl ' + (q < 5 ? 's' : q > 14 ? 'l' : ''), iconSize: [0, 0], html: `<div class="p" style="${bv(b)}">${best < 0 ? '–' : best}<span class="q">+${q - 1}</span></div>` }); } });
const MK = {};
SP.forEach(s => {
  const n = nota(s, I), b = banda(n);
  const m = L.marker([s.lat, s.lon], { n, icon: L.divIcon({ className: 'mk' + (foco && foco.id === s.id ? ' sel' : ''), iconSize: [0, 0], html: `${arco(s)}<div class="p" style="${bv(b)}"><span class="n">${n ?? '–'}</span><span class="nm">${s.nome}</span></div>` }), zIndexOffset: (n ?? 0) * 10 + (foco && foco.id === s.id ? 1000 : 0) });

const BOX = [-15, 34, -3, 45], kpx = desk ? 2.1 : 1.8;
const corV = sp => { const k = clamp((sp / kpx - 6) / 14, 0, 1); return [127 + 116 * k, 231 + 17 * k, 255 - 4 * k].map(Math.round).join(','); };

const V = Vento(cv, { n: desk ? 420 : 170, vida: [4, 8], cauda: 2.6, vref: 44, meandro: .42, largura: desk ? 1.5 : 1.3, alfa: .72, corDe: corV });
function campo() {
  const pts = D.campo.map(c => [c.lon, c.lat, c.w[I], c.wd[I]]);
  const W = cv.clientWidth, H = cv.clientHeight, S = 24, nx = Math.ceil(W / S) + 1, ny = Math.ceil(H / S) + 1, g = new Array(nx * ny);
  for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {

    const fx = gx - x0, fy = gy - y0; return [lerp(lerp(a[0], b[0], fx), lerp(c[0], d[0], fx), fy), lerp(lerp(a[1], b[1], fx), lerp(c[1], d[1], fx), fy)]; });

  if (foco) { f.innerHTML = `<div class="pega"></div><a class="voltar-l" href="#lista">${IC.CHEVR}Voltar à lista</a><div class="spot">${spotHTML(foco)}</div>`; $('regua48').hidden = true; }
  else if (estado === 'camadas') { f.innerHTML = `<div class="pega"></div><div class="camadas">${camadasHTML}</div>`; $('regua48').hidden = true; }
  else f.innerHTML = `<div class="pega"></div><a class="melhor" href="#spot/${top.s.id}"><span class="nota" style="${bv(banda(top.n))}">${top.n ?? '–'}</span><span style="min-width:0"><span class="t-mini">Melhor na vista · ${horaTxt(I)}</span><span class="lst-n" style="margin-top:4px">${top.s.nome}<span>${top.s.reg}</span></span></span>${IC.CHEVR.replace('<svg', '<svg class="seta" style="width:22px;height:22px;color:var(--sol)"')}</a>
    <div class="f-bts"><button class="f-bt on">${IC.FILTROS}Filtros<span class="q">1</span></button><button class="f-bt">Só a bombar</button><button class="f-bt on">Agrupar</button><button class="f-bt ic" aria-label="Sair do ecrã inteiro">${IC.SAIR}</button></div>`;
  const fh = f.offsetHeight; document.documentElement.style.setProperty('--folha', fh + 'px');
  const rh = $('regua48').hidden ? 0 : $('regua48').offsetHeight + 8;
  $('atrib').style.top = (innerHeight - fh - rh - 26) + 'px';
}
$('atrib').innerHTML = 'Base © <a href="https://www.esri.com">Esri</a>, HERE, Garmin, © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · <a href="https://leafletjs.com">Leaflet</a>';

/* ---------- pronto para captura ---------- */
let n = 0; const ok = () => { if (++n === 2) setTimeout(() => { if (vento && !reduz) V.avanca(90); window.__pronto = true; }, 700); };
base.once('load', ok); ref.once('load', ok); setTimeout(() => { window.__pronto = true; }, 15000);
window.__vento = { avanca: k => vento && !reduz && V.avanca(k) };
})();
</script>
